    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;

        const SEED_DATA = [
            { name: "示例：3D立体本", cost: 0.70, category: "本子" },
            { name: "示例：98K中性笔", cost: 0.50, category: "中性笔" },
        ];

        const SHIPPING_REGIONS = [
            { name: "江浙沪皖", base3kg: 2.15, heavyBase: 4.50, heavyUnitPrice: 0.70 },
            { name: "华中/华南", base3kg: 2.15, heavyBase: 4.50, heavyUnitPrice: 0.95 },
            { name: "华北地区", base3kg: 2.15, heavyBase: 4.50, heavyUnitPrice: 0.95 },
            { name: "西南区域", base3kg: 2.30, heavyBase: 5.00, heavyUnitPrice: 1.20 },
            { name: "偏远地区", base3kg: 15.00, heavyBase: 25.00, heavyUnitPrice: 15.00 },
        ];

        const holoCard = "han-card bg-gradient-to-br from-white/60 to-white/20 dark:from-slate-800/40 dark:to-slate-900/10 backdrop-blur-2xl border border-white/40 border-t-white/80 dark:border-slate-700/30 dark:border-t-slate-600/60 shadow-[0_8px_32px_rgba(0,0,0,0.06)] dark:shadow-[0_8px_32px_rgba(0,0,0,0.4)] shadow-[inset_0_1px_1px_rgba(255,255,255,0.9)] dark:shadow-[inset_0_1px_1px_rgba(255,255,255,0.1)] rounded-[2rem] transition-all duration-700 relative overflow-hidden";
        const holoInput = "han-input bg-white/40 dark:bg-black/20 backdrop-blur-xl border border-white/60 dark:border-white/10 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:bg-white/70 dark:focus:bg-slate-800/60 focus:outline-none focus:ring-2 focus:ring-amber-400/40 dark:focus:ring-amber-300/40 rounded-2xl transition-all shadow-[inset_0_2px_6px_rgba(0,0,0,0.05)] dark:shadow-[inset_0_2px_6px_rgba(0,0,0,0.4)]";
        const holoButton = "han-button bg-gradient-to-b from-white/80 to-white/40 dark:from-white/10 dark:to-white/5 backdrop-blur-xl border border-white/80 border-b-white/40 dark:border-white/20 dark:border-t-white/30 text-amber-800 dark:text-amber-300 hover:bg-white/90 dark:hover:bg-white/20 hover:-translate-y-0.5 shadow-sm hover:shadow-md dark:shadow-[0_4px_15px_rgba(0,0,0,0.3)] transition-all duration-300 rounded-2xl cursor-pointer flex items-center justify-center font-bold tracking-widest";

        const CornerCrosses = () => (
            <>
                <div className="absolute top-4 left-4 text-indigo-300/40 dark:text-cyan-400/20 font-mono text-[10px] pointer-events-none">+</div>
                <div className="absolute top-4 right-4 text-indigo-300/40 dark:text-cyan-400/20 font-mono text-[10px] pointer-events-none">+</div>
                <div className="absolute bottom-4 left-4 text-indigo-300/40 dark:text-cyan-400/20 font-mono text-[10px] pointer-events-none">+</div>
                <div className="absolute bottom-4 right-4 text-indigo-300/40 dark:text-cyan-400/20 font-mono text-[10px] pointer-events-none">+</div>
            </>
        );

        // 动态数值滚动组件
        const AnimatedNumber = ({ value, format = (v) => v.toFixed(2), className }) => {
            const [displayValue, setDisplayValue] = useState(value);
            useEffect(() => {
                let startTime = null;
                const startValue = displayValue;
                const distance = value - startValue;
                const duration = 700; // 与环形进度条动画时间同步
                if (distance === 0) return;
                let reqId;
                const animate = (currentTime) => {
                    if (!startTime) startTime = currentTime;
                    const progress = Math.min((currentTime - startTime) / duration, 1);
                    // easeOutQuart 缓动算法
                    const easeOutQuart = 1 - Math.pow(1 - progress, 4);
                    setDisplayValue(startValue + distance * easeOutQuart);
                    if (progress < 1) {
                        reqId = requestAnimationFrame(animate);
                    } else {
                        setDisplayValue(value);
                    }
                };
                reqId = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(reqId);
            }, [value]);
            return className ? <span className={className}>{format(displayValue)}</span> : <span>{format(displayValue)}</span>;
        };

        function App() {
            const [loading, setLoading] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(false);
            
            const [skus, setSkus] = useState(SEED_DATA);
            const [selectedCategory, setSelectedCategory] = useState("全部");
            const [selectedSku, setSelectedSku] = useState(SEED_DATA[0]);
            const [quantity, setQuantity] = useState(10);
            const [targetMargin, setTargetMargin] = useState(33.3);
            const [region, setRegion] = useState(SHIPPING_REGIONS[0]);
            const [cart, setCart] = useState([]);
            
            // 新增：进货单焦点索引，-1 表示未选中进货单里的任何商品
            const [selectedCartIndex, setSelectedCartIndex] = useState(-1);
            
            const [activeTab, setActiveTab] = useState('simulator');
            const [searchTerm, setSearchTerm] = useState('');
            const [importText, setImportText] = useState('');
            const [priceCopied, setPriceCopied] = useState(false);
            const [quoteCopied, setQuoteCopied] = useState(false);
            const [statusMsg, setStatusMsg] = useState({ type: null, text: '', data: null });
            
            const [quickAddName, setQuickAddName] = useState('');
            const [quickAddCost, setQuickAddCost] = useState('');
            const [quickAddCategory, setQuickAddCategory] = useState('');
            const [editingSkuName, setEditingSkuName] = useState(null);
            const [editingCostValue, setEditingCostValue] = useState('');
            const [editingCategorySkuName, setEditingCategorySkuName] = useState(null);
            
            const [showClearConfirm, setShowClearConfirm] = useState(false);

            const [queryTerm, setQueryTerm] = useState('');
            const [queryResult, setQueryResult] = useState(null);
            const [showQueryDropdown, setShowQueryDropdown] = useState(false);
            const [focusedSuggestionIndex, setFocusedSuggestionIndex] = useState(-1);

            const fileInputRef = useRef(null);
            const timeoutRef = useRef(null);
            const intervalRef = useRef(null);

            const adjustMargin = (delta) => {
                setTargetMargin(prev => {
                    const next = parseFloat((prev + delta).toFixed(1));
                    saveToLocal({ targetMargin: next });
                    return next;
                });
            };

            const stopAdjust = () => {
                if (timeoutRef.current) clearTimeout(timeoutRef.current);
                if (intervalRef.current) clearInterval(intervalRef.current);
                timeoutRef.current = null;
                intervalRef.current = null;
            };

            const startAdjust = (delta) => {
                stopAdjust(); 
                adjustMargin(delta); 
                timeoutRef.current = setTimeout(() => {
                    intervalRef.current = setInterval(() => { adjustMargin(delta); }, 50);
                }, 400);
            };

            const querySuggestions = useMemo(() => {
                if (!queryTerm.trim()) return [];
                return skus.filter(s => s.name.toLowerCase().includes(queryTerm.toLowerCase()));
            }, [queryTerm, skus]);

            // 新增：全局点击空白处自动取消进货单焦点
            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (selectedCartIndex === -1) return; // 本来就没焦点则跳过
                    
                    // 识别点击的是否是目标组件内部区域
                    const isInsideCartItem = e.target.closest('.cart-item-row');
                    const isInsideQuickAdd = e.target.closest('.quick-add-controls');
                    
                    // 点击非目标区域时，瞬间释放焦点
                    if (!isInsideCartItem && !isInsideQuickAdd) {
                        setSelectedCartIndex(-1);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, [selectedCartIndex]);

            // 安全的全局键盘焦点穿梭监听
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (activeTab !== 'simulator') return;
                    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
                    if (cart.length === 0) return;

                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        setSelectedCartIndex(prev => {
                            const next = prev === -1 ? 0 : (prev < cart.length - 1 ? prev + 1 : prev);
                            setTimeout(() => document.getElementById(`cart-item-${next}`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 0);
                            return next;
                        });
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        setSelectedCartIndex(prev => {
                            const next = prev === -1 ? cart.length - 1 : (prev > 0 ? prev - 1 : 0);
                            setTimeout(() => document.getElementById(`cart-item-${next}`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 0);
                            return next;
                        });
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [cart.length, activeTab]);

            useEffect(() => {
                try {
                    const savedDark = localStorage.getItem('yao_theme_dark');
                    if (savedDark !== null) {
                        setIsDarkMode(savedDark === 'true');
                    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        setIsDarkMode(true);
                    }

                    const localData = localStorage.getItem('yao_pricing_db_v2');
                    if (localData) {
                        const data = JSON.parse(localData);
                        if (data.skus) setSkus(data.skus);
                        if (data.lastCategory) setSelectedCategory(data.lastCategory);
                        const currentSkus = data.skus || SEED_DATA;
                        const found = currentSkus.find(s => s.name === data.lastSkuName);
                        if (found) setSelectedSku(found);
                        if (data.lastQuantity !== undefined) setQuantity(data.lastQuantity);
                        if (data.targetMargin !== undefined) setTargetMargin(data.targetMargin);
                        if (data.lastRegionName) {
                            const r = SHIPPING_REGIONS.find(reg => reg.name === data.lastRegionName);
                            if (r) setRegion(r);
                        }
                        if (data.cart) setCart(data.cart);
                    }
                } catch (e) {} 
                finally { setTimeout(() => setLoading(false), 300); }
            }, []);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            const toggleTheme = () => {
                setIsDarkMode(prev => {
                    const next = !prev;
                    localStorage.setItem('yao_theme_dark', next);
                    return next;
                });
            };

            const saveToLocal = (updates) => {
                try {
                    const current = JSON.parse(localStorage.getItem('yao_pricing_db_v2') || '{}');
                    const newData = { ...current, skus, lastCategory: selectedCategory, lastSkuName: selectedSku?.name || "", lastQuantity: quantity, targetMargin, lastRegionName: region.name, cart, ...updates };
                    localStorage.setItem('yao_pricing_db_v2', JSON.stringify(newData));
                } catch (e) {}
            };

            const calculateResult = (sku, q, marginGoal, reg) => {
                if (!sku || !q || q <= 0) return { price: 0, marginNum: 0, margin: "0%", isProfit: false, totalCost: 0, ship: 0, overhead: 0, profit: 0 };
                const prodCost = sku.cost * q;
                const weightKg = (35 * q) / 1000; 
                let ship = (weightKg <= 3) ? reg.base3kg : (weightKg > 9 ? weightKg * reg.heavyUnitPrice + reg.heavyBase : Math.ceil(weightKg / 3) * reg.base3kg);
                const fixed = 0.86; 
                const marginDec = marginGoal / 100;
                let calcPrice = (prodCost + ship + fixed) / (0.994 - marginDec);
                if (calcPrice <= 0 || isNaN(calcPrice)) calcPrice = (prodCost + ship + fixed) * 1.5;
                const fee = calcPrice * 0.006; 
                const totalCost = prodCost + ship + fixed + fee;
                const profit = calcPrice - totalCost;
                const finalMarginNum = calcPrice > 0 ? (profit / calcPrice) * 100 : 0;
                const totalOverhead = ship + fixed + fee;
                return { price: calcPrice, marginNum: finalMarginNum, margin: finalMarginNum.toFixed(1) + "%", isProfit: profit > 0, totalCost, ship, overhead: totalOverhead, profit };
            };

            const handleQuickAddPurchase = (sku, amount) => {

                    if (existingIdx >= 0) {
                        newCart = prev.map((item, i) => i === existingIdx ? { ...item, qty: item.qty + amount } : item);

                        newCart = [...prev, { sku, qty: amount }];
                        targetIndex = newCart.length - 1;

                    saveToLocal({ cart: newCart });
                    
                    // 安全同步更新焦点状态
                    setTimeout(() => setSelectedCartIndex(targetIndex), 0);
                    
                    return newCart;

                setStatusMsg({ type: 'success', text: `✨ 进货单已同步：${sku.name} ${amount > 0 ? '+' + amount : '已载入'}`, data: null });

                    setTimeout(() => { setQuoteCopied(false); setStatusMsg({ type: null, text: '', data: null }); }, 3000);
                }

            const mainStats = useMemo(() => calculateResult(selectedSku, quantity, targetMargin, region), [selectedSku, quantity, targetMargin, region]);

                saveToLocal({ skus: updatedSkus });

                    setSelectedSku(nextSku);
                    updates.lastSkuName = nextSku?.name || "";
                }
                saveToLocal(updates);

            const handleClearAllSkus = () => {
                setSkus([]);
                setSelectedSku(null);
                setCart([]); 
                saveToLocal({ skus: [], lastSkuName: "", cart: [] });
                setShowClearConfirm(false);
                setStatusMsg({ type: 'success', text: '数据库已完成初始化清空', data: null });
                setTimeout(() => setStatusMsg({ type: null, text: '', data: null }), 2000);
            };

            const handleDataProcess = (raw) => {
                if (!raw.trim()) return;
                const lines = raw.split(/\r?\n/).filter(l => l.trim() !== "");
                const results = lines.map((line) => {
                    let parts = line.includes('\t') ? line.split('\t') : (line.includes(',') ? line.split(',') : line.split(/\s{2,}/));
                    parts = parts.map(p => p.trim()).filter(p => p !== "");
                    if (parts.length < 2) return null;
                    const price = parseFloat(parts[1].replace(/[^\d.]/g, ''));
                    if (isNaN(price)) return null;
                    return { name: parts[0], cost: price, category: parts[2] || "导入商品" };
                }).filter(x => x);
                if (results.length > 0) setStatusMsg({ type: 'preview', text: `扫描完成：解析到 ${results.length} 条有效记录`, data: results });
            };

            const handleBulkConfirm = () => {
                if (!statusMsg.data) return;

                setStatusMsg({ type: 'success', text: '批量导入指令执行完毕', data: null }); setImportText('');
                setTimeout(() => { setActiveTab('library'); setStatusMsg({ type: null, text: '', data: null }); }, 1500);
            };

            const handleExportCSV = () => {

                let csvContent = BOM + "商品编码,进价成本(￥),分类\n";
                skus.forEach(sku => csvContent += `${sku.name},${sku.cost},${sku.category}\n`);
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                const dateStr = new Date().toISOString().split('T')[0];
                link.setAttribute('href', url);
                link.setAttribute('download', `全息数据库备份_${dateStr}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);

                if (stats.marginNum < 5) return { text: 'text-amber-500 dark:text-amber-400', glow: 'shadow-[0_0_15px_rgba(251,191,36,0.6)]', bg: 'bg-amber-500', tag: '微利状态', gradStart: '#fbbf24', gradEnd: '#d97706' };
                return { 
                    text: 'text-slate-700 dark:text-white', 
                    glow: 'shadow-[0_0_15px_rgba(255,255,255,0.7)]', 
                    bg: 'bg-white', 
                    tag: '健康盈利', 
                    gradStart: '#ffffff', 
                    gradEnd: isDarkMode ? 'rgba(255,255,255,0.1)' : 'rgba(148,163,184,0.5)' 
                };
            };

            const stratStyle = getIndicatorStyle(mainStats);
            const categories = ["全部", ...Array.from(new Set(skus.map(s => s.category)))];

            const handleCopyPrice = () => {

                el.value = mainStats.price.toFixed(2);
                document.body.appendChild(el);
                el.select();
                document.execCommand('copy');
                document.body.removeChild(el);
                setPriceCopied(true);
                setTimeout(() => setPriceCopied(false), 2000);
            };

            if (loading) return (
                <div className="min-h-screen bg-slate-50 dark:bg-[#050510] flex flex-col items-center justify-center gap-6">
                    <div className="relative">
                        <div className="absolute inset-0 bg-indigo-400 dark:bg-cyan-400 rounded-full blur-xl opacity-50 animate-pulse"></div>
                        <i className="ph-bold ph-aperture ph-spin text-indigo-600 dark:text-cyan-300 text-[50px] relative z-10"></i>
                    </div>
                    <span className="text-slate-500 dark:text-cyan-200/70 tracking-[0.3em] text-xs uppercase animate-pulse">构建空间计算环境...</span>
                </div>
            );

            return (
                <div className={isDarkMode ? "dark" : ""}>
                    <div className="min-h-screen relative font-sans antialiased text-slate-800 dark:text-slate-100 flex flex-col selection:bg-indigo-500/30 dark:selection:bg-cyan-400/30">
                        
                        {/* 极光/晨雾 动态背景引擎 */}

                            <div className="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-purple-300/40 mix-blend-multiply filter blur-[120px] animate-aurora dark:hidden" style={{animationDelay: '3s'}}></div>

                                                <div className="p-4 bg-emerald-50/90 dark:bg-emerald-900/30 border border-emerald-300 dark:border-emerald-500/50 rounded-2xl w-full animate-in slide-in-from-top-4 flex flex-col items-center gap-3 shadow-[0_8px_20px_rgba(16,185,129,0.15)] relative z-10">

                                                    <button onClick={handleBulkConfirm} className={`w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-400 text-white hover:opacity-90 border border-emerald-400 rounded-xl font-black text-sm flex items-center justify-center gap-2 tracking-widest transition-all shadow-lg hover:-translate-y-0.5`}><i className="ph-bold ph-arrows-clockwise text-[16px]"></i> 执行覆盖与重组程序</button>
                                                </div>
                                            )}
                                        </div>

                                        <div className={`${holoCard} p-6 flex flex-col items-center mt-5`}>
                                            <div className="flex items-center gap-4 mb-4 w-full border-b border-slate-200/50 dark:border-slate-700/50 pb-4">
                                                <div className="w-12 h-12 rounded-2xl bg-white/60 dark:bg-white/10 border border-white/80 dark:border-white/20 flex items-center justify-center text-slate-600 dark:text-cyan-100 shadow-md">
                                                    <i className="ph-fill ph-export text-[24px]"></i>
                                                </div>
                                                <div><h2 className="text-lg font-black text-slate-800 dark:text-white tracking-widest uppercase">全息资产实体导出节点</h2><p className="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-widest mt-0.5">Export Database</p></div>
                                            </div>
                                            <div className="w-full p-5 bg-white/40 dark:bg-black/20 border border-white/60 dark:border-white/10 rounded-2xl shadow-[inset_0_2px_10px_rgba(0,0,0,0.02)] dark:shadow-[inset_0_2px_10px_rgba(0,0,0,0.2)] flex flex-col sm:flex-row items-center justify-between gap-5">
                                                <div>
                                                    <h3 className="font-bold text-xs text-slate-600 dark:text-slate-300 uppercase tracking-widest">矩阵内驻留实体总数: <span className="text-indigo-600 dark:text-cyan-400 text-2xl ml-2 font-black drop-shadow-sm">{skus.length}</span></h3>
                                                </div>
                                                <button onClick={handleExportCSV} className={`${holoButton} shrink-0 px-6 py-3 flex items-center gap-2 text-[11px]`}>
                                                    <i className="ph-bold ph-download-simple text-[16px]"></i> 生成外部离线快照 (CSV)
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </main>

                            {/* 空间全息警告弹窗 */}
                            {showClearConfirm && (
                                <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/30 dark:bg-black/60 backdrop-blur-xl p-4 animate-in fade-in duration-300">
                                    <div className={`${holoCard} p-8 max-w-sm w-full flex flex-col items-center text-center !border-rose-300 dark:!border-rose-500/50 shadow-[0_20px_60px_rgba(244,63,94,0.15)] dark:shadow-[0_20px_60px_rgba(244,63,94,0.4)]`}>
                                        <div className="w-16 h-16 rounded-full bg-rose-50 dark:bg-rose-500/10 border border-rose-200 dark:border-rose-500/30 flex items-center justify-center text-rose-500 mb-5 shadow-inner">
                                            <i className="ph-fill ph-warning-octagon text-[32px] animate-pulse drop-shadow-sm"></i>
                                        </div>
                                        <h3 className="text-base font-black text-slate-800 dark:text-white mb-3 tracking-widest uppercase">底层格式化警告</h3>
                                        <p className="text-xs text-slate-600 dark:text-slate-300 mb-8 font-bold leading-relaxed px-2 bg-white/50 dark:bg-black/40 p-4 rounded-xl border border-white/80 dark:border-white/10 shadow-inner">
                                            正在请求：格式化全息矩阵数据库。<br/>所有资产实体记录将被彻底解构销毁。<br/>不可逆转。是否继续授权？
                                        </p>
                                        <div className="flex w-full gap-4">
                                            <button onClick={() => setShowClearConfirm(false)} className={`${holoButton} flex-1 py-3 text-xs`}>
                                                中止授权
                                            </button>
                                            <button onClick={handleClearAllSkus} className={`flex-1 py-3 font-black text-xs tracking-widest uppercase bg-gradient-to-r from-rose-500 to-rose-600 text-white hover:opacity-90 border border-rose-600 rounded-2xl transition-all shadow-lg hover:-translate-y-0.5`}>
                                                确认解构销毁
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <footer className="mt-5 py-4 flex flex-col sm:flex-row justify-between items-center gap-3 shrink-0 border-t border-white/40 dark:border-white/10">
                                <div className="flex items-center gap-6 text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">
                                    <div className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981] animate-pulse"></div> 物理加密</div>
                                    <div className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-indigo-500 dark:bg-cyan-400 shadow-[0_0_8px_currentColor] animate-pulse"></div> 状态保存</div>
                                </div>
                                <p className="text-slate-400 dark:text-slate-500 text-[9px] font-bold uppercase tracking-widest drop-shadow-sm">E-COMMERCE SPATIAL CORE // V16.0 PRO</p>
                            </footer>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
