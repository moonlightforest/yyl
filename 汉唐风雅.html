<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <title>尊享决策舱 // V16.0 满屏独立滚动版</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lux: {
                            gold: '#C5A059',
                            goldDark: '#A38446',
                            obsidian: '#000000',
                            charcoal: '#121318',
                            pearl: '#F5F5F7',
                            ruby: '#ff3b30', 
                            bronze: '#CD7F32'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        .texture-lux {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");
        }
        .dark .texture-lux {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
        
        /* 【核心重构：彻底锁定全局滚动】整个网页变为一个固定的壳子 */
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden !important; 
            overscroll-behavior: none !important; 
            background-color: #F5F5F7; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .dark body { background-color: #000000; }
        
        /* 【专有滚动视图】用于在小框内顺滑滚动商品，隐藏原生丑陋滚动条 */
        .inner-scroll {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* iOS 专属惯性顺滑滚动 */
            overscroll-behavior: contain; /* 阻止滚动溢出到父层 */
        }
        .inner-scroll::-webkit-scrollbar { display: none; }
        .inner-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        input, textarea, select {
            -webkit-user-select: auto !important;
            user-select: auto !important;
        }

        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="texture-lux">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;

        const SEED_DATA = [
            { name: "示例：3D立体本", cost: 0.70, category: "本子" },
            { name: "示例：98K中性笔", cost: 0.50, category: "中性笔" },
            { name: "示例：减压流沙文具盒", cost: 2.10, category: "文具盒" },
            { name: "示例：便签贴套装", cost: 0.85, category: "便签" },
            { name: "示例：A4护眼打印纸", cost: 12.50, category: "纸张" },
            { name: "示例：得力直液式走珠笔", cost: 1.20, category: "中性笔" }
        ];

        const SHIPPING_REGIONS = [
            { name: "江浙沪皖", base3kg: 2.15, heavyBase: 4.50, heavyUnitPrice: 0.70 },
            { name: "华中/华南", base3kg: 2.15, heavyBase: 4.50, heavyUnitPrice: 0.95 },
            { name: "华北地区", base3kg: 2.15, heavyBase: 4.50, heavyUnitPrice: 0.95 },
            { name: "西南区域", base3kg: 2.30, heavyBase: 5.00, heavyUnitPrice: 1.20 },
            { name: "偏远地区", base3kg: 15.00, heavyBase: 25.00, heavyUnitPrice: 15.00 },
        ];

        // 卡片基础样式优化：减小 padding 和阴影，让有限的一屏塞下更多信息
        const luxCard = "bg-white dark:bg-[#121318] border border-gray-200/80 dark:border-[#222328] shadow-[0_4px_15px_rgba(0,0,0,0.03)] dark:shadow-[0_8px_20px_rgba(0,0,0,0.6)] rounded-[1.2rem] relative overflow-hidden transition-all duration-300";
        // 强制所有输入框文本字号大于 16px 完美防止 Safari 点击放大，同时用较低的高度(38px)让界面紧凑
        const luxInput = "bg-gray-50/80 dark:bg-[#0a0a0c] border border-gray-200 dark:border-[#222328] text-gray-800 dark:text-gray-200 focus:border-lux-gold dark:focus:border-lux-gold rounded-lg shadow-[inset_0_1px_3px_rgba(0,0,0,0.02)] dark:shadow-[inset_0_1px_4px_rgba(0,0,0,0.4)] h-[38px] px-2 text-[16px] transition-colors";
        const luxButton = "bg-gradient-to-b from-white to-gray-50 dark:from-[#1c1d22] dark:to-[#121318] border border-gray-200 dark:border-[#2a2b30] text-gray-700 dark:text-gray-300 hover:text-lux-gold dark:hover:text-lux-gold shadow-sm dark:shadow-[0_2px_8px_rgba(0,0,0,0.3)] rounded-lg flex items-center justify-center font-bold active:opacity-70 h-[38px] transition-all";

        const LuxCardDeco = () => (
            <div className="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-gray-300 dark:via-gray-600 to-transparent opacity-50"></div>
        );

        function App() {
            const [loading, setLoading] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(false);
            
            const [skus, setSkus] = useState(SEED_DATA);
            const [selectedCategory, setSelectedCategory] = useState("全部");
            const [selectedSku, setSelectedSku] = useState(SEED_DATA[0]);
            const [quantity, setQuantity] = useState(10);
            const [targetMargin, setTargetMargin] = useState(33.3);
            const [region, setRegion] = useState(SHIPPING_REGIONS[0]);
            const [cart, setCart] = useState([]);
            
            const [activeTab, setActiveTab] = useState('simulator');
            const [searchTerm, setSearchTerm] = useState('');
            const [importText, setImportText] = useState('');
            const [priceCopied, setPriceCopied] = useState(false);
            const [quoteCopied, setQuoteCopied] = useState(false);
            const [statusMsg, setStatusMsg] = useState({ type: null, text: '', data: null });
            
            const [quickAddName, setQuickAddName] = useState('');
            const [quickAddCost, setQuickAddCost] = useState('');
            const [quickAddCategory, setQuickAddCategory] = useState('');
            const [editingSkuName, setEditingSkuName] = useState(null);
            const [editingCostValue, setEditingCostValue] = useState('');
            const [editingCategorySkuName, setEditingCategorySkuName] = useState(null);
            
            const [showClearConfirm, setShowClearConfirm] = useState(false);
            const [queryTerm, setQueryTerm] = useState('');
            const [queryResult, setQueryResult] = useState(null);
            const [showQueryDropdown, setShowQueryDropdown] = useState(false);
            const [focusedSuggestionIndex, setFocusedSuggestionIndex] = useState(-1);

            const fileInputRef = useRef(null);
            const timeoutRef = useRef(null);

            const dialRef = useRef(null);
            const [isDraggingDial, setIsDraggingDial] = useState(false);
            const latestMarginRef = useRef(targetMargin);

            useEffect(() => { latestMarginRef.current = targetMargin; }, [targetMargin]);

            const handleDialPointerDown = (e) => {
                setIsDraggingDial(true);
                e.currentTarget.setPointerCapture(e.pointerId);
                updateMarginFromDial(e);
            };

            const handleDialPointerMove = (e) => {
                if (!isDraggingDial) return;
                updateMarginFromDial(e);
            };

            const handleDialPointerUp = (e) => {
                setIsDraggingDial(false);
                e.currentTarget.releasePointerCapture(e.pointerId);
                saveToLocal({ targetMargin: latestMarginRef.current });
            };

            const updateMarginFromDial = (e) => {
                if (!dialRef.current) return;
                const rect = dialRef.current.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const x = e.clientX; const y = e.clientY;
                let rad = Math.atan2(y - centerY, x - centerX);
                let deg = (rad * 180) / Math.PI;
                deg = deg + 90;
                if (deg < 0) deg += 360;
                let newMargin = (deg / 360) * 100;
                newMargin = Math.round(newMargin * 10) / 10;
                latestMarginRef.current = newMargin;
                setTargetMargin(newMargin);
            };

            const adjustMargin = (delta) => {
                setTargetMargin(prev => {
                    const next = parseFloat((prev + delta).toFixed(1));
                    latestMarginRef.current = next;
                    saveToLocal({ targetMargin: next });
                    return next;
                });
            };

            const stopAdjust = () => {
                if (timeoutRef.current) clearTimeout(timeoutRef.current);
                timeoutRef.current = null;
            };

            const startAdjust = (delta) => {
                stopAdjust(); 
                adjustMargin(delta); 
                timeoutRef.current = setTimeout(() => {
                    timeoutRef.current = setInterval(() => { adjustMargin(delta); }, 50);
                }, 400);
            };

            const querySuggestions = useMemo(() => {
                if (!queryTerm.trim()) return [];
                return skus.filter(s => s.name.toLowerCase().includes(queryTerm.toLowerCase()));
            }, [queryTerm, skus]);

            useEffect(() => {
                try {
                    const savedDark = localStorage.getItem('yao_theme_dark');
                    if (savedDark !== null) { setIsDarkMode(savedDark === 'true'); } 
                    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) { setIsDarkMode(true); }

                    const localData = localStorage.getItem('yao_pricing_db_v2');
                    if (localData) {
                        const data = JSON.parse(localData);
                        if (data.skus) setSkus(data.skus);
                        if (data.lastCategory) setSelectedCategory(data.lastCategory);
                        const currentSkus = data.skus || SEED_DATA;
                        const found = currentSkus.find(s => s.name === data.lastSkuName);
                        if (found) setSelectedSku(found);
                        if (data.lastQuantity !== undefined) setQuantity(data.lastQuantity);
                        if (data.targetMargin !== undefined) { setTargetMargin(data.targetMargin); latestMarginRef.current = data.targetMargin; }
                        if (data.lastRegionName) {
                            const r = SHIPPING_REGIONS.find(reg => reg.name === data.lastRegionName);
                            if (r) setRegion(r);
                        }
                        if (data.cart) setCart(data.cart);
                    }
                } catch (e) {} finally { setTimeout(() => setLoading(false), 150); }
            }, []);

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    document.querySelector('meta[name="theme-color"][media="(prefers-color-scheme: light)"]')?.setAttribute("content", "#000000");
                } else {
                    document.documentElement.classList.remove('dark');
                    document.querySelector('meta[name="theme-color"][media="(prefers-color-scheme: light)"]')?.setAttribute("content", "#F5F5F7");
                }
            }, [isDarkMode]);

            const toggleTheme = () => {
                setIsDarkMode(prev => {
                    const next = !prev;
                    localStorage.setItem('yao_theme_dark', next);
                    return next;
                });
            };

            const saveToLocal = (updates) => {
                try {
                    const current = JSON.parse(localStorage.getItem('yao_pricing_db_v2') || '{}');
                    const newData = { ...current, skus, lastCategory: selectedCategory, lastSkuName: selectedSku?.name || "", lastQuantity: quantity, targetMargin, lastRegionName: region.name, cart, ...updates };
                    localStorage.setItem('yao_pricing_db_v2', JSON.stringify(newData));
                } catch (e) {}
            };

            const calculateResult = (sku, q, marginGoal, reg) => {
                if (!sku || !q || q <= 0) return { price: 0, marginNum: 0, margin: "0%", isProfit: false, totalCost: 0, ship: 0, overhead: 0, profit: 0 };
                const prodCost = sku.cost * q;
                const weightKg = (35 * q) / 1000; 
                let ship = (weightKg <= 3) ? reg.base3kg : (weightKg > 9 ? weightKg * reg.heavyUnitPrice + reg.heavyBase : Math.ceil(weightKg / 3) * reg.base3kg);
                const fixed = 0.86; 
                const marginDec = marginGoal / 100;
                let calcPrice = (prodCost + ship + fixed) / (0.994 - marginDec);
                if (calcPrice <= 0 || isNaN(calcPrice)) calcPrice = (prodCost + ship + fixed) * 1.5;
                const fee = calcPrice * 0.006; 
                const totalCost = prodCost + ship + fixed + fee;
                const profit = calcPrice - totalCost;
                const finalMarginNum = calcPrice > 0 ? (profit / calcPrice) * 100 : 0;
                const totalOverhead = ship + fixed + fee;
                return { price: calcPrice, marginNum: finalMarginNum, margin: finalMarginNum.toFixed(1) + "%", isProfit: profit > 0, totalCost, ship, overhead: totalOverhead, profit };
            };

            const addToCart = (sku) => {
                let newCart;
                setCart(prev => {
                    const existing = prev.find(item => item.sku.name === sku.name);
                    if (existing) {
                        newCart = prev.map(item => item.sku.name === sku.name ? { ...item, qty: item.qty + 10 } : item);
                    } else {
                        newCart = [...prev, { sku, qty: 10 }];
                    }
                    saveToLocal({ cart: newCart });
                    return newCart;
                });
                setQueryTerm('');
                setQueryResult(null);
                setStatusMsg({ type: 'success', text: `已放入沙盘：${sku.name}`, data: null });
                setTimeout(() => setStatusMsg({ type: null, text: '', data: null }), 1000);
            };

            const updateCartQty = (index, qty) => {
                setCart(prev => {
                    const newCart = prev.map((item, i) => i === index ? { ...item, qty: Math.max(1, qty) } : item);
                    saveToLocal({ cart: newCart });
                    return newCart;
                });
            };

            const removeFromCart = (index) => {
                setCart(prev => {
                    const newCart = prev.filter((_, i) => i !== index);
                    saveToLocal({ cart: newCart });
                    return newCart;
                });
            };

            const clearCart = () => { setCart([]); saveToLocal({ cart: [] }); };

            const bundleStats = useMemo(() => {
                if (cart.length === 0) return { price: 0, profit: 0, marginNum: 0, totalWeight: 0, shipping: 0, productCost: 0, totalCost: 0, totalQty: 0 };
                const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
                const totalProductCost = cart.reduce((sum, item) => sum + (item.sku.cost * item.qty), 0);
                const weightKg = (35 * totalQty) / 1000;
                let ship = (weightKg <= 3) ? region.base3kg : (weightKg > 9 ? weightKg * region.heavyUnitPrice + region.heavyBase : Math.ceil(weightKg / 3) * region.base3kg);
                const fixed = 1.50; 
                const marginDec = targetMargin / 100;
                let calcPrice = (totalProductCost + ship + fixed) / (0.994 - marginDec);
                if (calcPrice <= 0 || isNaN(calcPrice)) calcPrice = (totalProductCost + ship + fixed) * 1.5;
                const fee = calcPrice * 0.006;
                const totalCost = totalProductCost + ship + fixed + fee;
                const profit = calcPrice - totalCost;
                return { 
                    price: calcPrice, 
                    profit: profit, 
                    marginNum: (profit / calcPrice) * 100,
                    totalWeight: weightKg,
                    shipping: ship,
                    productCost: totalProductCost,
                    totalCost: totalCost,
                    totalQty: totalQty
                };
            }, [cart, targetMargin, region]);

            const handleGenerateQuotation = () => {
                if(cart.length === 0) return;
                let text = "✦ 尊享组合报价单 ✦\n";
                text += "===========================\n";
                cart.forEach((item, idx) => { text += `[${idx + 1}] ${item.sku.name} × ${item.qty}\n`; });
                text += "===========================\n";
                text += `✧ 目标区域：${region.name}\n`;
                text += `✧ 组合特惠：￥${bundleStats.price.toFixed(2)} (含运费)\n`;
                text += `✧ 包装规格：尊享加厚标准箱\n`;

                const el = document.createElement('textarea');
                el.value = text; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
                setQuoteCopied(true); setTimeout(() => setQuoteCopied(false), 1500);
            };

            const mainStats = useMemo(() => calculateResult(selectedSku, quantity, targetMargin, region), [selectedSku, quantity, targetMargin, region]);
            const isQuickAddReady = quickAddName.trim() !== '' && quickAddCost.trim() !== '' && quickAddCategory.trim() !== '';

            const handleQuickAdd = () => {
                if (!isQuickAddReady) return;
                const costNum = parseFloat(quickAddCost.replace(/[^\d.]/g, ''));
                if (isNaN(costNum)) return;
                const newSku = { name: quickAddName, cost: costNum, category: quickAddCategory };
                const newSkus = skus.some(s => s.name === quickAddName) ? skus.map(s => s.name === quickAddName ? newSku : s) : [...skus, newSku];
                setSkus(newSkus); setQuickAddName(''); setQuickAddCost(''); setQuickAddCategory('');
                saveToLocal({ skus: newSkus });
                setStatusMsg({ type: 'success', text: `入库成功：${quickAddName}`, data: null });
                setTimeout(() => setStatusMsg({ type: null, text: '', data: null }), 1500);
            };

            const handleEditCost = () => {
                const newCost = parseFloat(editingCostValue.replace(/[^\d.]/g, ''));
                if (isNaN(newCost)) return;
                const updatedSkus = skus.map(s => s.name === editingSkuName ? { ...s, cost: newCost } : s);
                setSkus(updatedSkus);
                if (selectedSku?.name === editingSkuName) setSelectedSku({ ...selectedSku, cost: newCost });
                saveToLocal({ skus: updatedSkus });
                setEditingSkuName(null);
            };

            const handleEditCategory = (skuName, newCategory) => {
                if (!newCategory) return;
                const updatedSkus = skus.map(s => s.name === skuName ? { ...s, category: newCategory } : s);
                setSkus(updatedSkus);
                if (selectedSku?.name === skuName) setSelectedSku({ ...selectedSku, category: newCategory });
                saveToLocal({ skus: updatedSkus });
                setEditingCategorySkuName(null);
            };

            const handleDeleteSku = (name) => {
                const newSkus = skus.filter(s => s.name !== name); setSkus(newSkus); 
                let updates = { skus: newSkus };
                if (selectedSku?.name === name) {
                    const nextSku = newSkus.length > 0 ? newSkus[0] : null;
                    setSelectedSku(nextSku); updates.lastSkuName = nextSku?.name || "";
                }
                saveToLocal(updates);
            };

            const handleClearAllSkus = () => {
                setSkus([]); setSelectedSku(null); setCart([]); 
                saveToLocal({ skus: [], lastSkuName: "", cart: [] });
                setShowClearConfirm(false);
            };

            const handleDataProcess = (raw) => {
                if (!raw.trim()) return;
                const lines = raw.split(/\r?\n/).filter(l => l.trim() !== "");
                const results = lines.map((line) => {
                    let parts = line.includes('\t') ? line.split('\t') : (line.includes(',') ? line.split(',') : line.split(/\s{2,}/));
                    parts = parts.map(p => p.trim()).filter(p => p !== "");
                    if (parts.length < 2) return null;
                    const price = parseFloat(parts[1].replace(/[^\d.]/g, ''));
                    if (isNaN(price)) return null;
                    return { name: parts[0], cost: price, category: parts[2] || "导入资产" };
                }).filter(x => x);
                if (results.length > 0) setStatusMsg({ type: 'preview', text: `解析到 ${results.length} 条记录`, data: results });
            };

            const handleBulkConfirm = () => {
                if (!statusMsg.data) return;
                setSkus(statusMsg.data); setSelectedSku(statusMsg.data[0]); setSelectedCategory("全部");
                saveToLocal({ skus: statusMsg.data, lastCategory: "全部", lastSkuName: statusMsg.data[0].name });
                setStatusMsg({ type: 'success', text: '数据覆盖完成', data: null }); setImportText('');
                setTimeout(() => setStatusMsg({ type: null, text: '', data: null }), 1500);
            };

            const handleExportCSV = () => {
                const BOM = '\uFEFF';
                let csvContent = BOM + "商品编码,进价成本(￥),分类\n";
                skus.forEach(sku => csvContent += `${sku.name},${sku.cost},${sku.category}\n`);
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a'); const url = URL.createObjectURL(blob);
                link.setAttribute('href', url); link.setAttribute('download', `全息备份_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const stratStyle = mainStats.isProfit ? (mainStats.marginNum < 5 ? { text: 'text-lux-bronze', tag: '微利' } : { text: 'text-lux-gold', tag: '健康' }) : { text: 'text-lux-ruby', tag: '亏损' };
            const categories = ["全部", ...Array.from(new Set(skus.map(s => s.category)))];

            const handleCopyPrice = () => {
                const el = document.createElement('textarea'); el.value = mainStats.price.toFixed(2);
                document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
                setPriceCopied(true); setTimeout(() => setPriceCopied(false), 1500);
            };

            if (loading) return (
                <div className="h-full w-full bg-lux-pearl dark:bg-lux-obsidian flex flex-col items-center justify-center gap-4 texture-lux absolute inset-0 z-50">
                    <div className="w-12 h-12 rounded-full border-[3px] border-gray-200 dark:border-gray-800 border-t-lux-gold animate-spin"></div>
                </div>
            );

            return (
                <div className={`${isDarkMode ? "dark" : ""} h-full w-full`}>
                    {/* 【外壳：弹性纵向布局，高度绝对100dvh】 */}
                    <div className="h-[100dvh] w-full relative flex flex-col font-sans text-gray-800 dark:text-gray-100 texture-lux transition-colors duration-500 overflow-hidden">
                        
                        {/* 顶栏：不压缩、固定占用高度 */}
                        <div className="w-full flex-none pt-[env(safe-area-inset-top,12px)] bg-transparent z-20">
                            <header className="flex items-center justify-between px-4 py-3">
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-lg flex items-center justify-center bg-white dark:bg-lux-charcoal border border-gray-200/80 dark:border-gray-800 text-lux-gold shadow-sm">
                                        <i className="ph-fill ph-crown text-[16px]"></i>
                                    </div>
                                    <h1 className="text-[15px] font-black tracking-tight drop-shadow-sm">姚银亮尊享舱</h1>
                                </div>

                                            {skus.length === 0 && <div className="absolute inset-0 flex items-center justify-center text-xs font-bold text-gray-400">金库暂无数据</div>}
                                        </div>
                                        
                                        {/* 危险区固定在底部 */}
                                        {skus.length > 0 && (
                                            <button onClick={() => setShowClearConfirm(true)} className="mt-2 shrink-0 py-2 bg-red-50 dark:bg-lux-ruby/10 border border-red-200 dark:border-lux-ruby/30 text-lux-ruby font-bold text-[11px] rounded-lg active:opacity-70 text-center w-full uppercase tracking-widest shadow-sm">
                                                格式化全部金库
                                            </button>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* --- TAB 4: 中枢调度 --- */}
                            {activeTab === 'import' && (
                                <div className="flex-1 min-h-0 inner-scroll flex flex-col gap-4 w-full animate-in fade-in duration-300 pb-2">
                                    <div className={`${luxCard} p-4 flex flex-col shrink-0`}>
                                        <h2 className="text-[13px] font-black uppercase tracking-widest border-b border-gray-100 dark:border-gray-800 pb-2 mb-3 flex items-center gap-1.5"><i className="ph-fill ph-plugs-connected text-lux-gold"></i>数据覆写通道</h2>
                                        <button onClick={() => fileInputRef.current?.click()} className={`${luxButton} !h-[60px] !border-dashed mb-3 flex flex-col items-center justify-center gap-1 bg-gray-50/50 dark:bg-black/20`}>
                                            <i className="ph-bold ph-file-csv text-[20px] text-lux-gold"></i> <span className="text-[10px]">选取本地 .CSV</span>
                                            <input type="file" accept=".csv,.txt" className="hidden" ref={fileInputRef} onChange={(e) => { const file = e.target.files?.[0]; if (file) { const reader = new FileReader(); reader.onload = (ev) => handleDataProcess(ev.target?.result); reader.readAsText(file); } }} />
                                        </button>
                                        <textarea className={`w-full h-24 p-3 text-[11px] font-mono ${luxInput} resize-none`} placeholder="或粘贴文本至此 (编码,基准值,分类)" value={importText} onChange={(e) => { setImportText(e.target.value); handleDataProcess(e.target.value); }} />
                                        {statusMsg.type === 'preview' && (
                                            <button onClick={handleBulkConfirm} className={`mt-3 w-full py-3 bg-emerald-600 text-white rounded-xl font-black text-xs flex items-center justify-center gap-1.5 active:scale-95 shadow-md`}><i className="ph-bold ph-arrows-clockwise text-[14px]"></i> 确认导入 {statusMsg.data?.length} 条资产</button>
                                        )}
                                    </div>
                                    <div className={`${luxCard} p-4 flex flex-col shrink-0`}>
                                        <h2 className="text-[13px] font-black uppercase tracking-widest border-b border-gray-100 dark:border-gray-800 pb-2 mb-3 flex items-center gap-1.5"><i className="ph-fill ph-export text-lux-gold"></i>离线快照备份</h2>
                                        <button onClick={handleExportCSV} className={`${luxButton} !h-[50px] flex items-center gap-2 text-[11px]`}>
                                            <i className="ph-bold ph-download-simple text-[16px] text-lux-gold"></i> 导出当前 {skus.length} 条数据
                                        </button>
                                    </div>
                                </div>
                            )}
                        </main>

                        {/* 【iOS Native Alert】强制悬浮在最上层 */}
                        {showClearConfirm && (
                            <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/40 dark:bg-black/60 backdrop-blur-sm px-5">
                                <div className="w-[270px] bg-[#f2f2f2]/90 dark:bg-[#1e1e1e]/90 backdrop-blur-2xl rounded-[14px] flex flex-col overflow-hidden scale-100 animate-in zoom-in-95 duration-200 shadow-2xl">
                                    <div className="p-5 flex flex-col items-center text-center">
                                        <h3 className="text-[17px] font-semibold text-black dark:text-white leading-tight">格式化金库</h3>
                                        <p className="text-[13px] text-gray-800 dark:text-gray-300 mt-1.5 leading-snug">此操作将抹除所有实体数据且不可逆转，是否确认执行？</p>
                                    </div>
                                    <div className="flex w-full border-t border-gray-300/60 dark:border-gray-600/60 h-[44px]">
                                        <button onClick={() => setShowClearConfirm(false)} className="flex-1 text-[17px] text-[#007aff] dark:text-[#0a84ff] font-normal border-r border-gray-300/60 dark:border-gray-600/60 active:bg-gray-300/50 dark:active:bg-white/10 transition-colors">取消</button>
                                        <button onClick={handleClearAllSkus} className="flex-1 text-[17px] text-lux-ruby font-semibold active:bg-gray-300/50 dark:active:bg-white/10 transition-colors">抹除</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 【底部导航栏 Tab Bar】固定在底部，完美避让 iOS Home 黑条 */}
                        <div className="w-full flex-none bg-white/85 dark:bg-[#121318]/85 backdrop-blur-3xl border-t border-gray-200 dark:border-[#222328] pb-[env(safe-area-inset-bottom)] z-50">
                            <nav className="flex justify-around items-center h-[56px] px-1">
                                {[ 
                                    { id: 'simulator', label: '单品测算', icon: 'ph-chart-pie-slice' }, 
                                    { id: 'sandbox', label: '组合沙盘', icon: 'ph-scales' }, 
                                    { id: 'library', label: '资产金库', icon: 'ph-vault' }, 
                                    { id: 'import', label: '中枢调度', icon: 'ph-arrows-left-right' } 
                                ].map(tab => (
                                    <button 
                                        key={tab.id} 
                                        onClick={() => setActiveTab(tab.id)} 
                                        className={`flex flex-col items-center justify-center w-full h-full space-y-[3px] active:opacity-70 transition-colors ${activeTab === tab.id ? 'text-lux-gold' : 'text-gray-400 dark:text-gray-500'}`}
                                    >
                                        <i className={`${activeTab === tab.id ? 'ph-fill' : 'ph'} ${tab.icon} text-[24px]`}></i>
                                        <span className="text-[10px] font-bold tracking-wider">{tab.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
