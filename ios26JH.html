<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 核心：强行突破 iOS 安全区限制，viewport-fit=cover 确保穿透灵动岛与底部触控区 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS PWA 专属 Meta 标签 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="决策舱PRO">
    
    <link rel="apple-touch-icon" href="https://api.iconify.design/ph/aperture-fill.svg?color=%236366f1&width=192&height=192">

    <title>决策舱 PRO // HOLOGRAPHIC OS</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { holo: { light: '#f8fafc', dark: '#050510' } }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* 终极杀招：彻底锁死底层物理视口，杜绝 iOS 任何形式的越界白边或黑边 */
        html, body, #root { 
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            position: fixed; 
            top: 0;
            left: 0;
            overflow: hidden;
            background-color: #f8fafc; /* 匹配明亮模式底色，填补任何可能的缝隙 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        /* 暗黑模式下底层彻底转黑 */
        html.dark, html.dark body, html.dark #root { background-color: #050510 !important; }
        
        .custom-scrollbar::-webkit-scrollbar { display: none; }
        .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes aurora {
            0% { transform: scale(1) translate(0px, 0px) rotate(0deg); }
            33% { transform: scale(1.1) translate(10vw, -10vh) rotate(15deg); }
            66% { transform: scale(0.9) translate(-10vw, 10vh) rotate(-15deg); }
            100% { transform: scale(1) translate(0px, 0px) rotate(0deg); }
        }
        .animate-aurora { animation: aurora 25s infinite alternate ease-in-out; }
        
        /* iOS 触控反馈 */
        .ios-btn-active:active { transform: scale(0.94); opacity: 0.8; transition: all 0.1s ease; }
        .ios-card-active:active { transform: scale(0.98); background-color: rgba(255,255,255,0.4); transition: all 0.1s ease; }
        html.dark .ios-card-active:active { background-color: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect, useCallback } = React;

        const SEED_DATA = [
            { name: "示例：3D立体本", cost: 0.70 },
            { name: "示例：98K中性笔", cost: 0.50 },
        ];

        // 动态数值滚动组件
        const AnimatedNumber = ({ value, format = (v) => v.toFixed(2), className }) => {
            const [displayValue, setDisplayValue] = useState(value);
            useEffect(() => {
                let startTime = null;
                const startValue = displayValue;
                const distance = value - startValue;
                const duration = 500; 
                if (distance === 0) return;
                let reqId;
                const animate = (currentTime) => {
                    if (!startTime) startTime = currentTime;
                    const progress = Math.min((currentTime - startTime) / duration, 1);
                    const easeOutQuart = 1 - Math.pow(1 - progress, 4);
                    setDisplayValue(startValue + distance * easeOutQuart);
                    if (progress < 1) { reqId = requestAnimationFrame(animate); } else { setDisplayValue(value); }
                };
                reqId = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(reqId);
            }, [value]);
            return className ? <span className={className}>{format(displayValue)}</span> : <span>{format(displayValue)}</span>;
        };

        // 苹果原生级：左滑删除卡片组件
        const SwipeableItem = ({ children, onDelete, isSwiped, onSwipe }) => {
            const [startX, setStartX] = useState(null);
            const handleTouchStart = (e) => setStartX(e.touches[0].clientX);
            const handleTouchMove = (e) => {
                if (!startX) return;
                const diff = e.touches[0].clientX - startX;
                if (diff < -30) onSwipe(true); // 左滑出垃圾桶
                if (diff > 30) onSwipe(false); // 右滑收回
            };
            const handleTouchEnd = () => setStartX(null);

            return (
                <div className="overflow-hidden w-full rounded-[1.8rem] mb-3" onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd}>
                    <div className={`flex w-[calc(100%+80px)] transition-transform duration-300 ease-out ${isSwiped ? '-translate-x-[80px]' : 'translate-x-0'}`}>
                        <div className="w-[calc(100%-80px)] shrink-0">
                            {children}
                        </div>
                        <div className="w-[80px] shrink-0 bg-rose-500 flex items-center justify-center text-white cursor-pointer active:bg-rose-600 transition-colors" onClick={(e) => { e.stopPropagation(); onDelete(); onSwipe(false); }}>
                            <i className="ph-bold ph-trash text-2xl"></i>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            // UI 常量声明
            const holoCard = "bg-white/60 dark:bg-slate-800/40 backdrop-blur-2xl border border-white/80 dark:border-white/5 shadow-xl rounded-[1.8rem] relative transition-all";
            const holoInput = "bg-white/60 dark:bg-black/30 backdrop-blur-xl border border-white/80 dark:border-white/10 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:bg-white/90 dark:focus:bg-slate-800/80 focus:outline-none focus:ring-2 focus:ring-indigo-400/50 dark:focus:ring-cyan-400/50 rounded-[1.2rem] transition-all text-base shadow-[inset_0_2px_6px_rgba(0,0,0,0.04)] dark:shadow-[inset_0_2px_6px_rgba(0,0,0,0.3)]";
            const holoButton = "bg-gradient-to-b from-white/90 to-white/50 dark:from-white/20 dark:to-white/5 backdrop-blur-xl border border-white/90 border-b-white/50 dark:border-white/20 dark:border-t-white/40 text-indigo-700 dark:text-cyan-400 ios-btn-active shadow-sm transition-all rounded-[1.2rem] cursor-pointer flex items-center justify-center font-bold tracking-widest select-none";
            const UI_STYLE = { card: holoCard, input: holoInput, btn: holoButton };

            const [loading, setLoading] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(false);
            
            const [skus, setSkus] = useState(SEED_DATA);
            const [selectedSku, setSelectedSku] = useState(SEED_DATA[0]);
            const [cart, setCart] = useState([]);
            
            const [selectedCartIndex, setSelectedCartIndex] = useState(-1);
            const [activeTab, setActiveTab] = useState('purchase'); 
            
            const [searchTerm, setSearchTerm] = useState('');
            const [statusMsg, setStatusMsg] = useState({ type: null, text: '', data: null });
            
            const [quickAddName, setQuickAddName] = useState('');
            const [quickAddCost, setQuickAddCost] = useState('');
            const [editingSkuName, setEditingSkuName] = useState(null);
            const [editingCostValue, setEditingCostValue] = useState('');
            const [swipedSkuName, setSwipedSkuName] = useState(null);
            const [showClearConfirm, setShowClearConfirm] = useState(false);

            const [queryTerm, setQueryTerm] = useState('');
            const [showQueryDropdown, setShowQueryDropdown] = useState(false);
            
            const [libraryDisplayCount, setLibraryDisplayCount] = useState(20);

            // AI 分析状态
            const [aiAdvice, setAiAdvice] = useState('');
            const [isAnalyzing, setIsAnalyzing] = useState(false);

            const fileInputRef = useRef(null);

            useEffect(() => {
                try {
                    const savedDark = localStorage.getItem('yao_theme_dark');
                    if (savedDark !== null) setIsDarkMode(savedDark === 'true');
                    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setIsDarkMode(true);

                    const localData = localStorage.getItem('yao_pricing_db_v5');
                    if (localData) {
                        const data = JSON.parse(localData);
                        if (data.skus) setSkus(data.skus);
                        const currentSkus = data.skus || SEED_DATA;
                        const found = currentSkus.find(s => s.name === data.lastSkuName);
                        if (found) setSelectedSku(found);
                        if (data.cart) setCart(data.cart);
                    }
                } catch (e) {} 
                finally { setTimeout(() => setLoading(false), 300); }
            }, []);

            useEffect(() => {
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const saveToLocal = (updates) => {
                try {
                    const current = JSON.parse(localStorage.getItem('yao_pricing_db_v5') || '{}');
                    const newData = { ...current, skus, lastSkuName: selectedSku?.name || "", cart, ...updates };
                    localStorage.setItem('yao_pricing_db_v5', JSON.stringify(newData));
                } catch (e) {}
            };

            const toggleTheme = () => setIsDarkMode(prev => { const n = !prev; localStorage.setItem('yao_theme_dark', n); return n; });

            useEffect(() => {
                setLibraryDisplayCount(20);
                setSwipedSkuName(null);
            }, [searchTerm, activeTab]);

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (selectedCartIndex === -1) return;
                    if (!e.target.closest('.cart-item-row') && !e.target.closest('.quick-add-controls')) {
                        setSelectedCartIndex(-1);
                    }
                };
                document.addEventListener('touchstart', handleClickOutside);
                document.addEventListener('mousedown', handleClickOutside);
                return () => { document.removeEventListener('touchstart', handleClickOutside); document.removeEventListener('mousedown', handleClickOutside); };
            }, [selectedCartIndex]);

            const handleQuickAddPurchase = (sku, amount) => {
                if (!sku) return;
                setCart(prev => {
                    const existingIdx = prev.findIndex(item => item.sku.name === sku.name);
                    let newCart;
                    if (existingIdx >= 0) {
                        newCart = prev.map((item, i) => i === existingIdx ? { ...item, qty: item.qty + amount } : item);
                        setTimeout(() => setSelectedCartIndex(existingIdx), 0);
                    } else {
                        newCart = [...prev, { sku, qty: amount }];
                        setTimeout(() => setSelectedCartIndex(newCart.length - 1), 0);
                    }
                    saveToLocal({ cart: newCart });
                    return newCart;
                });
                // 清理 AI 缓存，由于进货单变动
                setAiAdvice('');
                setStatusMsg({ type: 'success', text: amount > 0 ? `已加码 +${amount}` : '资产已载入' });
                setTimeout(() => setStatusMsg({ type: null, text: '' }), 1000);
            };

            const updateCartQty = (idx, qty) => {
                setCart(prev => {
                    const next = prev.map((item, i) => i === idx ? { ...item, qty: Math.max(0, qty) } : item);
                    saveToLocal({ cart: next }); return next;
                });
                setAiAdvice('');
            };

            const removeFromCart = (index, e) => {
                if(e) e.stopPropagation();
                setCart(prev => {
                    const newCart = prev.filter((_, i) => i !== index);
                    saveToLocal({ cart: newCart });
                    return newCart;
                });
                setSelectedCartIndex(-1);
                setAiAdvice('');
            };

            const clearCart = () => { setCart([]); saveToLocal({ cart: [] }); setSelectedCartIndex(-1); setAiAdvice(''); };

            const purchaseStats = useMemo(() => {
                if (cart.length === 0) return { totalQty: 0, totalCost: 0 };
                const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
                const totalCost = cart.reduce((sum, item) => sum + (item.sku.cost * item.qty), 0);
                return { totalQty, totalCost };
            }, [cart]);

            // Gemini API 智能分析调用逻辑
            const handleAIAnalyze = async () => {
                if (cart.length === 0) return;
                setIsAnalyzing(true);
                setAiAdvice('');
                try {
                    const apiKey = ""; // 执行环境会自动注入
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    
                    let cartStr = cart.map(item => `- ${item.sku.name}: ${item.qty}件 (进价￥${item.sku.cost.toFixed(2)})`).join('\n');
                    const userQuery = `请帮我分析以下进货单数据，总金额￥${purchaseStats.totalCost.toFixed(2)}，总件数${purchaseStats.totalQty}。\n\n进货明细：\n${cartStr}\n\n请给出专业、简练的采购建议和利润优化方向。`;
                    
                    const payload = {
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: "你是一个专业的零售进货分析专家，语气简练、专业、有洞察力。不要使用markdown格式，请用平白连贯的中文回答，字数控制在150字以内。" }] }
                    };

                    let retries = 3;
                    let delay = 1000;
                    let response = null;
                    while(retries > 0) {
                        try {
                            response = await fetch(url, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'application/json' }});
                            if (response.ok) break;
                        } catch (e) {}
                        retries--;
                        await new Promise(r => setTimeout(r, delay));
                        delay *= 2;
                    }

                    if (!response || !response.ok) throw new Error("API Error");
                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "分析接口未返回有效建议。";
                    setAiAdvice(text);
                } catch (err) {
                    console.error("AI 接口调用失败:", err);
                    setAiAdvice('网络链接波动，量子分析接口暂时不可用，请稍后再试。');
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const isQuickAddReady = quickAddName.trim() !== '' && quickAddCost.trim() !== '';
            const activeSku = (selectedCartIndex >= 0 && cart[selectedCartIndex]) ? cart[selectedCartIndex].sku : selectedSku;

            const handleQuickAdd = () => {
                if (!isQuickAddReady) return;
                const costNum = parseFloat(quickAddCost.replace(/[^\d.]/g, ''));
                if (isNaN(costNum)) return;
                const newSku = { name: quickAddName, cost: costNum };
                const newSkus = skus.some(s => s.name === quickAddName) ? skus.map(s => s.name === quickAddName ? newSku : s) : [newSku, ...skus]; 
                setSkus(newSkus); setQuickAddName(''); setQuickAddCost('');
                saveToLocal({ skus: newSkus });
                setStatusMsg({ type: 'success', text: `✨ 录入成功：${quickAddName}` });
                setTimeout(() => setStatusMsg({ type: null, text: '' }), 2000);
            };

            const handleEditCost = () => {
                const newCost = parseFloat(editingCostValue.replace(/[^\d.]/g, ''));
                if (isNaN(newCost)) return;
                const updatedSkus = skus.map(s => s.name === editingSkuName ? { ...s, cost: newCost } : s);
                setSkus(updatedSkus);
                if (selectedSku?.name === editingSkuName) setSelectedSku({ ...selectedSku, cost: newCost });
                saveToLocal({ skus: updatedSkus });
                setEditingSkuName(null);
                setSwipedSkuName(null);
            };

            const handleDeleteSku = (name) => {
                const newSkus = skus.filter(s => s.name !== name);
                setSkus(newSkus); 
                let updates = { skus: newSkus };
                if (selectedSku?.name === name) {
                    const nextSku = newSkus.length > 0 ? newSkus[0] : null;
                    setSelectedSku(nextSku);
                    updates.lastSkuName = nextSku?.name || "";
                }
                saveToLocal(updates);
                setSwipedSkuName(null);
            };

            const handleClearAllSkus = () => {
                setSkus([]); setSelectedSku(null); setCart([]); 
                saveToLocal({ skus: [], lastSkuName: "", cart: [] });
                setShowClearConfirm(false);
                setStatusMsg({ type: 'success', text: '数据库已完成清空' });
                setTimeout(() => setStatusMsg({ type: null, text: '' }), 2000);
            };

            const handleDataProcess = (raw) => {
                if (!raw.trim()) return;
                const lines = raw.split(/\r?\n/).filter(l => l.trim() !== "");
                const results = lines.map((line) => {
                    let parts = line.includes('\t') ? line.split('\t') : (line.includes(',') ? line.split(',') : line.split(/\s{2,}/));
                    parts = parts.map(p => p.trim()).filter(p => p !== "");
                    if (parts.length < 2) return null;
                    const price = parseFloat(parts[1].replace(/[^\d.]/g, ''));
                    if (isNaN(price)) return null;
                    return { name: parts[0], cost: price };
                }).filter(x => x);
                if (results.length > 0) {
                    setSkus(results); setSelectedSku(results[0]);
                    saveToLocal({ skus: results, lastSkuName: results[0].name });
                    setStatusMsg({ type: 'success', text: `成功覆盖 ${results.length} 条数据` });
                    setTimeout(() => setStatusMsg({ type: null, text: '' }), 2000);
                }
            };

            const handleExportCSV = () => {
                const BOM = '\uFEFF';
                let csvContent = BOM + "资产名称,进价成本(￥)\n";
                skus.forEach(sku => csvContent += `${sku.name},${sku.cost}\n`);
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                const dateStr = new Date().toISOString().split('T')[0];
                link.setAttribute('href', url);
                link.setAttribute('download', `全息数据库备份_${dateStr}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const querySuggestions = useMemo(() => {
                if (!queryTerm.trim()) return [];
                return skus.filter(s => s.name.toLowerCase().includes(queryTerm.toLowerCase()));
            }, [queryTerm, skus]);

            if (loading) return (
                <div className="absolute inset-0 bg-slate-50 dark:bg-[#050510] flex flex-col items-center justify-center gap-6">
                    <div className="relative">
                        <div className="absolute inset-0 bg-indigo-400 dark:bg-cyan-400 rounded-full blur-xl opacity-50 animate-pulse"></div>
                        <i className="ph-bold ph-aperture ph-spin text-indigo-600 dark:text-cyan-300 text-[60px] relative z-10"></i>
                    </div>
                </div>
            );

            // ================== Main Render ==================
            return (
                <div className={`w-full h-full flex flex-col font-sans antialiased text-slate-800 dark:text-slate-100 select-none ${isDarkMode ? 'dark' : ''}`}>
                    
                    {/* 背景极光 (绝对定位，贯穿铺满物理全屏) */}
                    <div className="absolute inset-0 z-0 pointer-events-none w-full h-full">
                        <div className="absolute top-[-20%] left-[-10%] w-[100vw] h-[100vw] bg-indigo-500/20 dark:bg-indigo-600/20 rounded-full blur-[120px] animate-aurora"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[80vw] h-[80vw] bg-cyan-400/15 dark:bg-cyan-500/10 rounded-full blur-[100px] animate-aurora" style={{animationDelay: '-5s'}}></div>
                    </div>

                    {/* 灵动岛沉浸式 Header (完全透明，融入背景，自动避让安全区) */}
                    <header 
                        className="flex justify-between items-center px-6 pb-2 z-50 shrink-0 relative pointer-events-auto"
                        style={{ paddingTop: 'max(16px, env(safe-area-inset-top))' }}
                    >
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-xl bg-indigo-600 dark:bg-cyan-500 flex items-center justify-center text-white dark:text-slate-900 shadow-lg"><i className="ph-bold ph-aperture"></i></div>
                            <h1 className="text-sm font-black tracking-widest uppercase drop-shadow-sm">决策舱 PRO</h1>
                        </div>
                        <div className="ios-btn-active w-10 h-10 bg-black/5 dark:bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center border border-black/5 dark:border-white/5" onClick={toggleTheme}>
                            <i className={`ph-fill ${isDarkMode ? 'ph-moon text-amber-300' : 'ph-sun text-indigo-600'} text-xl`}></i>
                        </div>
                    </header>

                    {/* 全局提示 Toast (避开灵动岛往下推移) */}
                    {statusMsg.text && (
                        <div 
                            className="absolute left-1/2 -translate-x-1/2 z-[100] animate-in slide-in-from-top-4 fade-in duration-300 pointer-events-none"
                            style={{ top: 'calc(max(16px, env(safe-area-inset-top)) + 50px)' }}
                        >
                            <div className="bg-slate-800/90 dark:bg-white/90 backdrop-blur-xl text-white dark:text-slate-900 px-5 py-2.5 rounded-full text-xs font-bold shadow-2xl flex items-center gap-2 border border-white/10">
                                <i className="ph-fill ph-check-circle text-emerald-400 dark:text-emerald-500 text-base"></i> {statusMsg.text}
                            </div>
                        </div>
                    )}

                    {/* 主内容区 */}
                    <main className="flex-1 overflow-hidden relative z-10 w-full max-w-lg mx-auto">
                        
                        {/* 1. 智能分析 Dashboard View */}
                        {activeTab === 'dashboard' && (
                            <div className="flex flex-col gap-5 p-5 pb-[150px] overflow-y-auto h-full custom-scrollbar animate-in slide-in-from-right-4">
                                <div className="text-center py-4">
                                    <h2 className="text-3xl font-black tracking-tight mb-1">进货大屏</h2>
                                    <p className="text-[10px] font-bold opacity-40 uppercase tracking-widest">Smart Purchase Analytics</p>
                                </div>

                                {cart.length === 0 ? (
                                    <div className={`${UI_STYLE.card} p-10 flex flex-col items-center justify-center text-center opacity-40 mt-8`}>
                                        <i className="ph-fill ph-chart-polar text-6xl mb-4"></i>
                                        <div className="font-bold text-sm">进货单无数据</div>
                                        <div className="text-xs mt-1">添加资产以生成资金报表</div>
                                    </div>
                                ) : (
                                    <div className="space-y-5">
                                        <div className={`${UI_STYLE.card} p-6 flex flex-col gap-2 relative overflow-hidden bg-gradient-to-br from-indigo-500 to-purple-600 dark:from-cyan-600 dark:to-blue-700 text-white border-none shadow-xl shadow-indigo-500/20`}>
                                            <div className="absolute top-0 right-0 w-32 h-32 bg-white/20 rounded-full blur-2xl -translate-y-1/2 translate-x-1/4 pointer-events-none"></div>
                                            <span className="text-xs font-bold opacity-80 uppercase tracking-widest">预测资金流出</span>
                                            <div className="text-5xl font-black tracking-tighter">￥<AnimatedNumber value={purchaseStats.totalCost} /></div>
                                            <div className="text-[11px] font-bold opacity-70 mt-1 bg-white/20 self-start px-3 py-1 rounded-full">已激活 {cart.length} 个款式 / 共 {purchaseStats.totalQty} 件单品</div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className={`${UI_STYLE.card} p-5 flex flex-col items-center text-center justify-center`}>
                                                <span className="text-[10px] font-bold opacity-40 uppercase tracking-widest mb-1">价格最高单品</span>
                                                <span className="text-base font-black text-slate-800 dark:text-white truncate w-full px-1">
                                                    {[...cart].sort((a,b)=>(b.sku.cost*b.qty)-(a.sku.cost*a.qty))[0].sku.name}
                                                </span>
                                            </div>
                                            <div className={`${UI_STYLE.card} p-5 flex flex-col items-center text-center justify-center`}>
                                                <span className="text-[10px] font-bold opacity-40 uppercase tracking-widest mb-1">最贵单品进价</span>
                                                <span className="text-2xl font-black text-slate-800 dark:text-white">
                                                    ￥{Math.max(...cart.map(i=>i.sku.cost)).toFixed(2)}
                                                </span>
                                            </div>
                                        </div>

                                        {/* 接入 Gemini AI 诊断功能 */}
                                        <div className={`${UI_STYLE.card} p-5 flex flex-col gap-4`}>
                                            <div className="flex items-center justify-between opacity-80">
                                                <div className="flex items-center gap-2">
                                                    <i className="ph-fill ph-magic-wand text-lg text-indigo-500"></i>
                                                    <span className="text-xs font-black uppercase tracking-widest text-indigo-600 dark:text-cyan-400">AI 智能采购诊断</span>
                                                </div>
                                            </div>
                                            
                                            {aiAdvice ? (
                                                <div className="bg-white/50 dark:bg-black/20 rounded-2xl p-4 text-sm leading-relaxed border border-indigo-100 dark:border-white/5 shadow-inner whitespace-pre-wrap font-medium">
                                                    {aiAdvice}
                                                </div>
                                            ) : (
                                                <button 
                                                    onClick={handleAIAnalyze} 
                                                    disabled={isAnalyzing}
                                                    className={`w-full py-4 rounded-2xl font-black text-sm ios-btn-active shadow-lg transition-all ${isAnalyzing ? 'bg-slate-200 dark:bg-slate-800 text-slate-400' : 'bg-gradient-to-r from-indigo-500 to-purple-500 text-white shadow-indigo-500/30'}`}
                                                >
                                                    {isAnalyzing ? (
                                                        <span className="flex items-center justify-center gap-2"><i className="ph-bold ph-spinner animate-spin"></i> 正在连接量子计算节点...</span>
                                                    ) : (
                                                        <span className="flex items-center justify-center gap-2"><i className="ph-bold ph-sparkle"></i> 生成全息进货建议</span>
                                                    )}
                                                </button>
                                            )}
                                        </div>

                                        <div className={`${UI_STYLE.card} p-5 space-y-5`}>
                                            <div className="flex items-center gap-2 opacity-60 border-b border-black/5 dark:border-white/5 pb-3">
                                                <i className="ph-fill ph-chart-bar text-lg"></i>
                                                <span className="text-xs font-black uppercase tracking-widest">资金流向占比 (大头排序)</span>
                                            </div>
                                            <div className="space-y-4 pt-1">
                                                {[...cart].sort((a,b)=>(b.sku.cost*b.qty)-(a.sku.cost*a.qty)).map((item, idx) => {
                                                    const itemCost = item.sku.cost * item.qty;
                                                    const percentage = (itemCost / purchaseStats.totalCost) * 100;
                                                    return (
                                                        <div key={idx} className="space-y-1.5">
                                                            <div className="flex justify-between text-xs font-bold">
                                                                <span className="truncate pr-4 flex-1">{item.sku.name} <span className="text-[10px] opacity-40 ml-1">x {item.qty}</span></span>
                                                                <span className="shrink-0 text-indigo-600 dark:text-cyan-400">￥{itemCost.toFixed(2)}</span>
                                                            </div>
                                                            <div className="w-full h-2 bg-black/5 dark:bg-white/10 rounded-full overflow-hidden">
                                                                <div className="h-full bg-indigo-500 dark:bg-cyan-400 rounded-full transition-all duration-1000" style={{width: `${percentage}%`}}></div>
                                                            </div>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                        
                        {/* 2. 查询进货 View */}
                        {activeTab === 'purchase' && (
                            <div className="flex flex-col h-full animate-in slide-in-from-right-4 relative z-10">
                                <div className="flex-1 overflow-y-auto custom-scrollbar px-4 pt-2 pb-[320px]">
                                    
                                    {/* 固定置顶的总额卡片 */}
                                    <div className="sticky top-0 z-30 pt-1 pb-4 bg-transparent">
                                        <div className="p-6 bg-slate-900/90 dark:bg-white/95 backdrop-blur-xl rounded-[2rem] text-white dark:text-slate-900 shadow-[0_15px_40px_rgba(0,0,0,0.15)] flex flex-col justify-center items-center text-center border border-white/10 dark:border-black/5 relative overflow-hidden">
                                            <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-500/30 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
                                            <div className="text-[11px] font-bold opacity-60 uppercase tracking-widest relative z-10">应付采购总额</div>
                                            <div className="text-[44px] font-black tracking-tighter mt-0.5 mb-2 text-indigo-300 dark:text-indigo-600 relative z-10 leading-none">￥<AnimatedNumber value={purchaseStats.totalCost} /></div>
                                            <div className="text-[10px] font-bold opacity-80 bg-white/10 dark:bg-black/5 px-4 py-1.5 rounded-full relative z-10">总计装载 {purchaseStats.totalQty} 件商品</div>
                                        </div>
                                    </div>

                                    <div className="flex justify-between items-end mb-4 px-1 mt-2">
                                        <div>
                                            <h2 className="text-xl font-black tracking-tight">清单明细</h2>
                                        </div>
                                        {cart.length > 0 && (
                                            <div className="ios-btn-active p-2.5 bg-rose-50 dark:bg-rose-500/10 text-rose-500 rounded-2xl" onClick={clearCart}><i className="ph-bold ph-trash text-lg"></i></div>
                                        )}
                                    </div>

                                    {cart.length === 0 ? (
                                        <div className="flex flex-col items-center justify-center h-48 opacity-20 mt-4">
                                            <i className="ph-bold ph-shopping-cart-simple text-6xl mb-2"></i>
                                            <span className="text-xs font-bold tracking-widest">清单目前处于真空状态</span>
                                        </div>
                                    ) : (
                                        <div className="space-y-3">
                                            {cart.map((item, idx) => (
                                                <div key={idx} id={`cart-item-${idx}`} onClick={() => setSelectedCartIndex(idx)} className={`cart-item-row ${UI_STYLE.card} p-4 flex justify-between items-center ios-card-active ${selectedCartIndex === idx ? '!bg-indigo-50/90 dark:!bg-cyan-900/40 border-2 border-indigo-400 dark:border-cyan-500' : ''}`}>
                                                    <div className="flex flex-col flex-1 truncate pr-3">
                                                        <span className={`text-base font-bold truncate ${selectedCartIndex === idx ? 'text-indigo-700 dark:text-cyan-300' : 'text-slate-800 dark:text-slate-100'}`}>{item.sku.name}</span>
                                                        <span className="text-[11px] font-bold text-slate-500 dark:text-slate-400 mt-1.5 tracking-widest">
                                                            ￥{item.sku.cost.toFixed(2)} × {item.qty} = <span className={`${selectedCartIndex === idx ? 'text-indigo-700 dark:text-cyan-300' : 'text-indigo-600 dark:text-cyan-400'} font-black text-sm`}>￥{(item.sku.cost * item.qty).toFixed(2)}</span>
                                                        </span>
                                                    </div>
                                                    <div className="flex items-center gap-2 shrink-0">
                                                        <input type="number" value={item.qty} onClick={e=>e.stopPropagation()} onChange={(e)=>updateCartQty(idx, parseInt(e.target.value)||0)} className={`w-14 px-1 py-2 text-sm font-black text-center text-indigo-600 dark:text-cyan-300 bg-white/60 dark:bg-black/30 border border-black/5 dark:border-white/10 rounded-xl outline-none focus:ring-2 focus:ring-indigo-400`} />
                                                        <button onClick={(e)=>removeFromCart(idx, e)} className="w-10 h-10 rounded-xl bg-white/50 dark:bg-black/40 text-rose-400 flex items-center justify-center ios-btn-active"><i className="ph-bold ph-minus-circle text-xl"></i></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* 底部悬浮控制台 (安全穿透) */}
                                <div className="fixed bottom-[calc(max(16px,env(safe-area-inset-bottom))+90px)] left-4 right-4 z-40 pointer-events-none flex flex-col gap-3 quick-add-controls">
                                    <div className={`${UI_STYLE.card} p-3 shadow-2xl pointer-events-auto`}>
                                        <div className="flex items-center justify-between gap-2 overflow-x-auto custom-scrollbar mb-1 pl-1">
                                            <div className="flex items-center gap-1.5 shrink-0">
                                                <div className={`w-2 h-2 rounded-full ${selectedCartIndex >= 0 ? 'bg-amber-400 animate-pulse' : 'bg-emerald-400'}`}></div>
                                                <span className="text-[10px] font-bold text-slate-500 dark:text-slate-300 truncate max-w-[80px]">
                                                    {activeSku ? activeSku.name : '未选择'}
                                                </span>
                                            </div>
                                            <div className="flex items-center gap-1.5 shrink-0">
                                                {/* 极简快捷加购 */}
                                                {[50, 100, 500, 1000].map(num => (
                                                    <button key={num} onClick={() => activeSku && handleQuickAddPurchase(activeSku, num)} className={`px-3 py-1.5 text-[11px] font-black rounded-full transition-transform active:scale-90 flex items-center justify-center ${selectedCartIndex >= 0 ? 'bg-indigo-500 text-white dark:bg-cyan-500 dark:text-slate-900 shadow-lg shadow-indigo-500/20' : 'bg-slate-200 dark:bg-slate-700 text-indigo-600 dark:text-cyan-400 border border-white/50 dark:border-white/5'}`}>
                                                        <span className="opacity-40 font-normal mr-[1px]">+</span>{num}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        <div className="relative group">
                                            <input type="text" placeholder="大拇指滑向此处搜寻资产..." className={UI_STYLE.input + " !rounded-full py-4 pl-12 pr-28 shadow-inner font-bold text-base bg-white/80 dark:bg-black/40"} value={queryTerm} onChange={e => {setQueryTerm(e.target.value); setShowQueryDropdown(true); setSelectedCartIndex(-1);}} onFocus={() => {setShowQueryDropdown(true); setSelectedCartIndex(-1);}} onBlur={() => setTimeout(() => setShowQueryDropdown(false), 200)} onKeyDown={e => { if (e.key === 'Enter') { if (querySuggestions.length > 0) { const s = querySuggestions[0]; setQueryTerm(s.name); setSelectedSku(s); handleQuickAddPurchase(s, 0); setShowQueryDropdown(false); e.target.blur(); } } }} />
                                            <i className="ph-bold ph-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-xl opacity-40 pointer-events-none"></i>
                                            
                                            {/* 搜索框右侧实时价格面板 */}
                                            <div className="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-2">
                                                {activeSku && (
                                                    <span className="text-base font-black text-indigo-600 dark:text-cyan-400 pointer-events-none border-l border-black/10 dark:border-white/10 pl-2">
                                                        ￥{activeSku.cost.toFixed(2)}
                                                    </span>
                                                )}
                                                {queryTerm && <button onClick={() => {setQueryTerm(''); setShowQueryDropdown(false);}} className="text-slate-400 active:scale-90 p-1"><i className="ph-bold ph-x-circle text-xl"></i></button>}
                                            </div>
                                            
                                            {/* 超宽浮动下拉列表 */}
                                            {showQueryDropdown && queryTerm && (
                                                <div className="absolute bottom-[calc(100%+12px)] left-[-16px] right-[-16px] bg-white/95 dark:bg-slate-900/95 backdrop-blur-3xl rounded-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.15)] dark:shadow-[0_-10px_40px_rgba(0,0,0,0.6)] max-h-64 overflow-y-auto p-3 border border-black/5 dark:border-white/5 animate-in slide-in-from-bottom-4 z-[120]">
                                                    {querySuggestions.length > 0 ? querySuggestions.map(s => (
                                                        <div key={s.name} className="p-4 ios-card-active rounded-2xl flex justify-between items-center gap-3 border-b border-black/5 dark:border-white/5 last:border-0" onClick={() => {setQueryTerm(s.name); setSelectedSku(s); handleQuickAddPurchase(s, 0); setShowQueryDropdown(false);}}>
                                                            <div className="font-bold text-sm whitespace-normal break-words leading-tight flex-1">{s.name}</div>
                                                            <div className="text-indigo-600 dark:text-cyan-400 font-black shrink-0">￥{s.cost.toFixed(2)}</div>
                                                        </div>
                                                    )) : <div className="p-6 text-center opacity-40 text-sm font-bold">无匹配实体</div>}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 3. 资产矩阵 View (解决卡顿：按需渲染 + 苹果原生左滑删除) */}
                        {activeTab === 'library' && (
                            <div 
                                className="flex flex-col h-full animate-in slide-in-from-right-4 p-5 pb-[320px] overflow-y-auto custom-scrollbar"
                                onScroll={(e) => {
                                    const { scrollTop, clientHeight, scrollHeight } = e.currentTarget;
                                    if (scrollHeight - scrollTop - clientHeight < 150) {
                                        setLibraryDisplayCount(prev => prev + 20); // 触底加载下一批
                                    }
                                }}
                            >
                                <div className="flex justify-between items-end mb-6">
                                    <div>
                                        <h2 className="text-2xl font-black tracking-tight flex items-center gap-2">
                                            资产矩阵 
                                            <span className="text-[10px] font-bold opacity-40 uppercase tracking-widest mt-1 bg-black/5 dark:bg-white/10 px-2 py-1 rounded-md">{skus.length} 驻留</span>
                                        </h2>
                                    </div>
                                    <div className="flex items-center gap-1.5 ios-btn-active px-3 py-1.5 bg-rose-50 dark:bg-rose-500/10 text-rose-500 rounded-xl cursor-pointer" onClick={() => setShowClearConfirm(true)}>
                                        <span className="text-[10px] font-bold">全部清空</span>
                                        <i className="ph-bold ph-warning-circle text-base"></i>
                                    </div>
                                </div>

                                <input className={UI_STYLE.input + " mb-5 !py-3 !rounded-2xl"} placeholder="在全息矩阵中全局检索..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />

                                <div className="space-y-0">
                                    {skus.filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase())).slice(0, libraryDisplayCount).map((sku, idx) => (
                                        <SwipeableItem 
                                            key={sku.name} 
                                            isSwiped={swipedSkuName === sku.name} 
                                            onSwipe={(isLeft) => setSwipedSkuName(isLeft ? sku.name : null)}
                                            onDelete={() => handleDeleteSku(sku.name)}
                                        >
                                            <div className={UI_STYLE.card + " p-4 flex justify-between items-center ios-card-active gap-3"}>
                                                <div className="font-bold text-sm truncate flex-1">{sku.name}</div>
                                                <div className="flex items-center gap-2 shrink-0 ml-1">
                                                    {editingSkuName === sku.name ? (
                                                        <input autoFocus className="w-16 bg-indigo-50 dark:bg-white/10 py-1 rounded-lg text-center text-xs font-black outline-none border border-indigo-400" value={editingCostValue} onChange={e=>setEditingCostValue(e.target.value)} onBlur={handleEditCost} />
                                                    ) : (
                                                        <div className="font-black text-indigo-600 dark:text-cyan-400 px-3 py-1.5 rounded-lg bg-indigo-50/50 dark:bg-cyan-900/20 active:scale-95 text-sm" onClick={() => {setEditingSkuName(sku.name); setEditingCostValue(sku.cost.toString());}}>￥{sku.cost.toFixed(2)}</div>
                                                    )}
                                                </div>
                                            </div>
                                        </SwipeableItem>
                                    ))}
                                </div>

                                {/* 底部悬浮录入区 */}
                                <div className="fixed bottom-[calc(max(16px,env(safe-area-inset-bottom))+90px)] left-4 right-4 z-40">
                                    <div className={`${UI_STYLE.card} p-4 flex flex-col gap-3 shadow-2xl`}>
                                        <div className="text-[10px] font-black opacity-30 uppercase tracking-[0.2em] text-center">资产注册终端</div>
                                        <button className={`w-full py-4 rounded-[1.2rem] font-black text-sm ios-btn-active transition-colors mb-1 ${isQuickAddReady ? 'bg-indigo-600 dark:bg-cyan-500 text-white dark:text-slate-900 shadow-lg shadow-indigo-500/30' : 'bg-slate-200 dark:bg-white/5 text-slate-400'}`} onClick={handleQuickAdd}>
                                            <i className="ph-bold ph-plus mr-1"></i> 注册实体入库
                                        </button>
                                        <div className="flex gap-3 items-center">
                                            <div className="relative flex-[2]">
                                                <i className="ph-bold ph-tag absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                                <input className={UI_STYLE.input + " pl-9 !py-3"} placeholder="资产名称" value={quickAddName} onChange={e => setQuickAddName(e.target.value)} />
                                            </div>
                                            <div className="relative flex-1">
                                                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">￥</span>
                                                <input className={UI_STYLE.input + " pl-7 !py-3 font-black"} placeholder="0.00" value={quickAddCost} onChange={e => setQuickAddCost(e.target.value)} />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 4. 终端互联 View */}
                        {activeTab === 'sync' && (
                            <div className="flex flex-col gap-6 p-6 animate-in slide-in-from-right-4 h-full overflow-y-auto custom-scrollbar pb-[200px]">
                                <div className="text-center py-10 relative">
                                    <div className="w-24 h-24 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl shadow-2xl shadow-indigo-500/30">📡</div>
                                    <h2 className="text-2xl font-black tracking-tight mb-2">同步节点</h2>
                                    <p className="text-[10px] font-bold opacity-30 uppercase tracking-widest">Cross-Terminal Sync</p>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div className={UI_STYLE.card + " p-8 text-center ios-card-active cursor-pointer"} onClick={handleExportCSV}>
                                        <i className="ph-fill ph-download-simple text-4xl text-indigo-500 mb-4"></i>
                                        <div className="text-xs font-black tracking-widest">导出快照</div>
                                    </div>
                                    <div className={UI_STYLE.card + " p-8 text-center ios-card-active cursor-pointer"} onClick={() => fileInputRef.current.click()}>
                                        <i className="ph-fill ph-upload-simple text-4xl text-emerald-500 mb-4"></i>
                                        <div className="text-xs font-black tracking-widest">导入实体</div>
                                        <input type="file" ref={fileInputRef} className="hidden" onChange={e => { const reader = new FileReader(); reader.onload = ev => handleDataProcess(ev.target.result); reader.readAsText(e.target.files[0]); }} />
                                    </div>
                                </div>

                                {/* 底部法语寄语专属标识 */}
                                <div className="mt-16 flex flex-col items-center justify-center opacity-40 pointer-events-none w-full gap-2 select-none">
                                    <div className="text-[12px] font-serif font-bold tracking-widest text-slate-800 dark:text-slate-200 mb-1 italic">
                                        Une belle vie se crée par soi-même
                                    </div>
                                    <div className="text-[11px] font-black tracking-[0.3em] text-slate-800 dark:text-white">姚银亮独家设计</div>
                                    <div className="text-[8px] font-bold uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">Exclusively Designed by Yao Yinliang</div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 清除确认弹窗 */}
                    {showClearConfirm && (
                        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/60 backdrop-blur-md p-6 animate-in fade-in pointer-events-auto">
                            <div className={UI_STYLE.card + " p-8 w-full max-w-sm text-center space-y-6 !bg-white dark:!bg-slate-900 shadow-2xl"}>
                                <div className="w-20 h-20 bg-rose-50 dark:bg-rose-900/20 rounded-full flex items-center justify-center mx-auto text-rose-500 text-4xl"><i className="ph-fill ph-warning-octagon"></i></div>
                                <div className="font-black text-xl">确认清除全部矩阵数据？</div>
                                <p className="text-sm opacity-40">此操作将永久销毁所有驻留实体，不可逆转。</p>
                                <div className="flex w-full flex-col gap-3">
                                    <button className="w-full py-4 bg-rose-500 text-white rounded-2xl font-black shadow-lg shadow-rose-500/30 active:scale-95 transition-transform" onClick={handleClearAllSkus}>确认销毁</button>
                                    <button className="w-full py-4 bg-slate-100 dark:bg-white/5 rounded-2xl font-bold active:scale-95 transition-transform" onClick={() => setShowClearConfirm(false)}>中止操作</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* iOS 悬浮导航栏 (Floating Tab Bar) 半透明悬浮态 */}
                    <nav className="fixed bottom-[calc(max(16px,env(safe-area-inset-bottom)))] left-4 right-4 z-[100] bg-white/80 dark:bg-[#1a1c29]/90 backdrop-blur-3xl shadow-[0_10px_40px_rgba(0,0,0,0.12)] dark:shadow-[0_10px_40px_rgba(0,0,0,0.6)] border border-white/80 dark:border-white/10 rounded-[2.5rem]">
                        <div className="flex justify-around items-center h-[76px] px-2 max-w-lg mx-auto relative">
                            {[
                                { id: 'dashboard', icon: 'ph-presentation-chart', label: '进货大屏' },
                                { id: 'purchase', icon: 'ph-shopping-cart', label: '查询进货' },
                                { id: 'library', icon: 'ph-database', label: '资产矩阵' },
                                { id: 'sync', icon: 'ph-arrows-left-right', label: '终端互联' }
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className="relative z-10 flex flex-col items-center justify-center w-full h-full gap-1 ios-btn-active">
                                    {activeTab === tab.id && <div className="absolute top-0 left-1/2 -translate-x-1/2 w-10 h-1.5 bg-indigo-600 dark:bg-cyan-400 rounded-full shadow-[0_2px_8px_rgba(99,102,241,0.6)]"></div>}
                                    <i className={`${activeTab === tab.id ? 'ph-fill text-indigo-600 dark:text-cyan-400' : 'ph-bold text-slate-400 dark:text-slate-500'} ${tab.icon} text-[24px]`}></i>
                                    <span className={`text-[9px] font-black ${activeTab === tab.id ? 'text-indigo-600 dark:text-cyan-400' : 'text-slate-400 dark:text-slate-500'}`}>{tab.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
