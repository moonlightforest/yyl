<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>润晟软件 V3.0 // Windows 11 Edition</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Segoe UI Variable"', '"Segoe UI"', '"Microsoft YaHei"', 'sans-serif']
                    },
                    colors: {
                        win: {
                            light: '#f3f3f3',
                            dark: '#202020',
                            cardLight: 'rgba(255, 255, 255, 0.7)',
                            cardDark: 'rgba(45, 45, 45, 0.7)',
                            accent: '#0067c0',
                            accentDark: '#4cc2ff'
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* Windows 11 基础样式重置 */
        *, *::before, *::after { box-sizing: border-box; }
        
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            background-color: #f3f3f3; 
            color: #1a1a1a;
        }
        
        html.dark body { 
            background-color: #202020; 
            color: #ffffff;
        }

        /* Windows 风格滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 10px; }
        html.dark ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.4); }
        html.dark ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

        /* 横向滚动条适配 */
        .horizontal-scroll::-webkit-scrollbar { height: 8px; width: 8px; }

        /* Win11 绽放背景模拟 */
        .win-bg-bloom {
            position: absolute;
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(0,103,192,0.15) 0%, rgba(0,0,0,0) 70%);
            top: -20%;
            right: -10%;
            z-index: 0;
            pointer-events: none;
        }
        html.dark .win-bg-bloom {
            background: radial-gradient(circle, rgba(76,194,255,0.1) 0%, rgba(0,0,0,0) 70%);
        }

        /* 输入框底边高亮特效 */
        .win-input:focus { border-bottom-color: #0067c0; border-bottom-width: 2px; padding-bottom: calc(0.5rem - 1px); }
        html.dark .win-input:focus { border-bottom-color: #4cc2ff; }

        /* 金色雕刻文字特效 */
        .gold-engraved {
            color: #b8860b; 
            text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.7), -1px -1px 1px rgba(0, 0, 0, 0.15);
        }
        html.dark .gold-engraved {
            color: #d4af37; 
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9), -1px -1px 1px rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect, useCallback } = React;

        const SEED_DATA = [
            { name: "示例：3D立体本", cost: 0.70, category: "本子", priceHistory: [] },
            { name: "示例：98K中性笔", cost: 0.50, category: "中性笔", priceHistory: [] },
        ];

        const CHART_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4', '#f97316', '#ec4899'];

        // 动态数值组件
        const AnimatedNumber = ({ value, format = (v) => v.toFixed(2), className }) => {
            const [displayValue, setDisplayValue] = useState(value);
            useEffect(() => {
                let startTime = null;
                const startValue = displayValue;
                const distance = value - startValue;
                if (distance === 0) return;
                const animate = (t) => {
                    if (!startTime) startTime = t;
                    const p = Math.min((t - startTime) / 300, 1); 
                    setDisplayValue(startValue + distance * (1 - Math.pow(1 - p, 3)));
                    if (p < 1) requestAnimationFrame(animate); else setDisplayValue(value);
                };
                requestAnimationFrame(animate);
            }, [value]);
            return <span className={className}>{format(displayValue)}</span>;
        };

        // 自定义精简版 SVG 饼图组件
        const SvgPieChart = ({ data }) => {
            const total = data.reduce((sum, d) => sum + d.value, 0);
            if(total === 0 || data.length === 0) return <div className="w-full h-full flex items-center justify-center text-gray-400 font-bold text-sm">暂无数据分布</div>;
            let cumulativePercent = 0;
            return (
                <svg viewBox="-1 -1 2 2" className="w-full h-full" style={{ transform: 'rotate(-90deg)' }}>
                    {data.map((slice, i) => {
                        const percent = slice.value / total;
                        if (percent === 1) return <circle r="1" fill={slice.color} key={slice.label} />;
                        const startX = Math.cos(2 * Math.PI * cumulativePercent);
                        const startY = Math.sin(2 * Math.PI * cumulativePercent);
                        cumulativePercent += percent;
                        const endX = Math.cos(2 * Math.PI * cumulativePercent);
                        const endY = Math.sin(2 * Math.PI * cumulativePercent);
                        const largeArcFlag = percent > 0.5 ? 1 : 0;
                        const pathData = [`M 0 0`, `L ${startX} ${startY}`, `A 1 1 0 ${largeArcFlag} 1 ${endX} ${endY}`, `Z`].join(' ');
                        return <path d={pathData} fill={slice.color} key={slice.label} className="hover:opacity-80 transition-opacity cursor-pointer" />;
                    })}
                </svg>
            )
        };

        function App() {
            // Windows 11 UI 风格类
            const winCard = "bg-white/80 dark:bg-[#2d2d2d]/80 backdrop-blur-xl border border-black/5 dark:border-white/10 shadow-sm rounded-xl transition-all";
            const winInput = "win-input w-full bg-white dark:bg-[#1f1f1f] border border-gray-300 dark:border-gray-600 rounded-md px-3 py-2 text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none transition-colors";
            const winButton = "bg-win-accent dark:bg-win-accentDark text-white dark:text-slate-900 hover:opacity-90 active:scale-[0.98] px-4 py-2 rounded-md font-medium text-sm transition-all shadow-sm flex items-center justify-center gap-2";
            const winButtonSec = "bg-gray-100 dark:bg-[#333333] text-gray-800 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-[#444444] active:scale-[0.98] border border-black/5 dark:border-white/5 px-4 py-2 rounded-md font-medium text-sm transition-all flex items-center justify-center gap-2";

            const [loading, setLoading] = useState(true);
            const [isDarkMode, setIsDarkMode] = useState(false);
            
            const [skus, setSkus] = useState(SEED_DATA);
            const [cart, setCart] = useState([]);
            const [savedLists, setSavedLists] = useState([]); 
            
            const [activeView, setActiveView] = useState('workspace'); // workspace, history, owed, analytics, database
            
            const [queryTerm, setQueryTerm] = useState('');
            const [showQueryDropdown, setShowQueryDropdown] = useState(false);
            const [selectedCartIndex, setSelectedCartIndex] = useState(-1);
            
            const [highlightedSuggestionIndex, setHighlightedSuggestionIndex] = useState(-1);
            
            const [editingCartItemIndex, setEditingCartItemIndex] = useState(-1);
            const [editingCartItemCost, setEditingCartItemCost] = useState('');

            // 资产管理状态
            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('All'); 
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'ascending' }); 
            
            const [quickAddName, setQuickAddName] = useState('');
            const [quickAddCost, setQuickAddCost] = useState('');
            const [editingSkuName, setEditingSkuName] = useState(null);
            const [editingCostValue, setEditingCostValue] = useState('');
            
            // 分类编辑状态
            const [editingCategorySkuName, setEditingCategorySkuName] = useState(null);
            const [highlightedCatIndex, setHighlightedCatIndex] = useState(-1);

            const [showClearConfirm, setShowClearConfirm] = useState(false);
            const [statusMsg, setStatusMsg] = useState({ type: null, text: '' });
            
            // 自定义弹窗状态
            const [dialog, setDialog] = useState({ visible: false, title: '', message: '', onConfirm: null, isAlert: false });
            
            const [contextMenu, setContextMenu] = useState({ visible: false, x: 0, y: 0, listId: null, view: '' });
            const [remarkTooltip, setRemarkTooltip] = useState({ visible: false, x: 0, y: 0, text: '' });
            const [importText, setImportText] = useState(''); 

            const fileInputRef = useRef(null);
            const historyScrollRef = useRef(null); 

            // 智能监听鼠标滚轮事件
            useEffect(() => {
                const el = historyScrollRef.current;
                if (!el) return;
                const handleWheel = (e) => {
                    const innerScroll = e.target.closest('.custom-scrollbar');
                    if (innerScroll && innerScroll.scrollHeight > innerScroll.clientHeight) return;
                    
                    if (e.deltaY !== 0) {
                        e.preventDefault();
                        el.scrollLeft += e.deltaY;
                    }
                };
                el.addEventListener('wheel', handleWheel, { passive: false });
                return () => el.removeEventListener('wheel', handleWheel);
            }, [activeView]);

            // 数据持久化初始化
            useEffect(() => {
                try {
                    const savedDark = localStorage.getItem('yao_theme_dark_win');
                    if (savedDark !== null) setIsDarkMode(savedDark === 'true');
                    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setIsDarkMode(true);

                    const localData = localStorage.getItem('yao_pricing_db_win');
                    if (localData) {
                        const data = JSON.parse(localData);
                        if (data.skus) setSkus(data.skus);
                        if (data.cart) setCart(data.cart);
                        if (data.savedLists) setSavedLists(data.savedLists);
                    }
                } catch (e) {} 
                finally { setTimeout(() => setLoading(false), 200); }
            }, []);

            useEffect(() => {
                if (isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDarkMode]);

            const saveToLocal = (updates) => {
                try {
                    const current = JSON.parse(localStorage.getItem('yao_pricing_db_win') || '{}');
                    const newData = { ...current, skus, cart, savedLists, ...updates };
                    localStorage.setItem('yao_pricing_db_win', JSON.stringify(newData));
                } catch (e) {}
            };

            const toggleTheme = () => setIsDarkMode(prev => { const n = !prev; localStorage.setItem('yao_theme_dark_win', n); return n; });

            const showToast = (text, type = 'success') => {
                setStatusMsg({ type, text });
                setTimeout(() => setStatusMsg({ type: null, text: '' }), 4000); 
            };

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (contextMenu.visible) setContextMenu({ visible: false, x: 0, y: 0, listId: null });
                    if (selectedCartIndex === -1) return;
                    if (!e.target.closest('.cart-item-row') && !e.target.closest('.quick-add-controls')) setSelectedCartIndex(-1);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, [selectedCartIndex, contextMenu.visible]);

            const checkPriceWarning = (skuName, newCost) => {
                const existing = skus.find(s => s.name === skuName);
                if(existing) {
                    const hist = existing.priceHistory || [];
                    const avg = hist.length > 0 ? (hist.reduce((sum, h)=>sum+h.cost,0) + existing.cost) / (hist.length + 1) : existing.cost;
                    if(newCost > avg * 1.1) {
                        showToast(`⚠️ 警报：[${skuName}] 历史均价为￥${avg.toFixed(2)}，本次进价偏高！`, 'warning');
                    } else if (hist.length > 0 && newCost < avg * 0.9) {
                        showToast(`📉 提示：[${skuName}] 本次进价低于历史均价￥${avg.toFixed(2)}。`, 'success');
                    }
                }
            };

            const recordPriceHistory = (existingSku, newCost) => {
                if (existingSku.cost === newCost) return existingSku;
                const hist = existingSku.priceHistory || [];
                const d = new Date();
                const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                return { ...existingSku, cost: newCost, priceHistory: [...hist, { date: dateStr, cost: existingSku.cost }] };
            };

            const handleQuickAddPurchase = (sku, amount) => {
                if (!sku) return;
                setCart(prev => {
                    const existingIdx = prev.findIndex(item => item.sku.name === sku.name);
                    let newCart;
                    if (existingIdx >= 0) {
                        newCart = prev.map((item, i) => i === existingIdx ? { ...item, qty: item.qty + amount } : item);
                        setSelectedCartIndex(existingIdx);
                    } else {
                        newCart = [...prev, { sku, qty: amount }];
                        setSelectedCartIndex(newCart.length - 1);
                    }
                    saveToLocal({ cart: newCart });
                    return newCart;
                });
                showToast(`已将 ${sku.name} 接入清单`);
            };

            const updateCartQty = (idx, qty) => {
                setCart(prev => {
                    const next = prev.map((item, i) => i === idx ? { ...item, qty: Math.max(0, qty) } : item);
                    saveToLocal({ cart: next }); return next;
                });
            };

            const removeFromCart = (index, e) => {
                if(e) e.stopPropagation();
                setCart(prev => {
                    const newCart = prev.filter((_, i) => i !== index);
                    saveToLocal({ cart: newCart });
                    return newCart;
                });
                setSelectedCartIndex(-1);
            };

            const clearCart = () => { setCart([]); saveToLocal({ cart: [] }); setSelectedCartIndex(-1); };

            const handleEditCartItemCost = (idx) => {
                const newCost = parseFloat(String(editingCartItemCost).replace(/[^\d.]/g, ''));
                if (isNaN(newCost)) {
                    setEditingCartItemIndex(-1);
                    return;
                }

                const skuName = cart[idx].sku.name;
                checkPriceWarning(skuName, newCost);
                const updatedSkus = skus.map(s => s.name === skuName ? recordPriceHistory(s, newCost) : s);
                
                const updatedCart = cart.map(c => {
                    if (c.sku.name === skuName) {
                        return { ...c, sku: { ...c.sku, cost: newCost } };
                    }
                    return c;
                });

                setSkus(updatedSkus);
                setCart(updatedCart);
                saveToLocal({ skus: updatedSkus, cart: updatedCart });
                setEditingCartItemIndex(-1);
                showToast(`已更新 [${skuName}] 的单价为 ￥${newCost.toFixed(2)}，并同步至底层矩阵`);
            };

            const purchaseStats = useMemo(() => {
                if (cart.length === 0) return { totalQty: 0, totalCost: 0 };
                const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
                const totalCost = cart.reduce((sum, item) => sum + (item.sku.cost * item.qty), 0);
                return { totalQty, totalCost };
            }, [cart]);

            const getDynamicTextSize = (numVal, baseSize = 'text-4xl', midSize = 'text-3xl', smallSize = 'text-2xl') => {
                if (!numVal || isNaN(numVal)) return baseSize;
                const len = numVal.toFixed(2).length;
                if (len >= 10) return smallSize; 
                if (len >= 8) return midSize;    
                return baseSize;                 
            };

            // ---- 清单存档与流水逻辑 ----
            const handleSaveList = () => {
                if (cart.length === 0) {
                    showToast('清单为空，无法存档', 'warning');
                    return;
                }
                const firstItemName = cart[0].sku.name;
                const date = new Date();
                const timeStr = `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
                
                const newList = {
                    id: Date.now(),
                    name: `${firstItemName} 批次`, 
                    items: cart.map(i => ({ ...i, isOwed: false })), 
                    totalQty: purchaseStats.totalQty,
                    totalCost: purchaseStats.totalCost,
                    timestamp: timeStr,
                    hiddenFromWorkspace: false
                };
                
                setSavedLists(prev => {
                    let combined = [newList, ...prev];
                    if (combined.length > 50) {
                        const owedLists = combined.filter(l => l.items.some(i => i.isOwed));
                        const normalLists = combined.filter(l => !l.items.some(i => i.isOwed));
                        const allowedNormalCount = Math.max(0, 50 - owedLists.length);
                        const keptNormal = normalLists.slice(0, allowedNormalCount);
                        combined = [...owedLists, ...keptNormal].sort((a, b) => b.id - a.id);
                    }
                    saveToLocal({ savedLists: combined, cart: [] });
                    return combined;
                });
                
                setCart([]); setSelectedCartIndex(-1);
                showToast(`已归档并生成流水记录：${newList.name}`);
            };

            const handleLoadList = (list) => {
                const loadAction = () => {
                    const cleanItems = list.items.map(item => { const { isOwed, ...rest } = item; return rest; });
                    setCart(cleanItems); saveToLocal({ cart: cleanItems }); setSelectedCartIndex(-1);
                    setActiveView('workspace'); showToast(`成功恢复清单：${list.name}`);
                };
                if (cart.length > 0) {
                    setDialog({ visible: true, title: '覆盖警告', message: '加载历史清单将覆盖当前工作台上的所有数据，是否继续？', onConfirm: loadAction });
                } else {
                    loadAction();
                }
            };

            const handleDeleteList = (id) => {
                const listToDelete = savedLists.find(l => l.id === id);
                if (listToDelete && listToDelete.items.some(i => i.isOwed)) {
                    setDialog({ visible: true, isAlert: true, title: '【系统拦截】', message: '该记录中包含未处理的欠货商品！\n请先前往「欠货追踪大盘」解除所有欠款状态后，方可彻底销毁此清单。' });
                    return;
                }
                setSavedLists(prev => {
                    const next = prev.filter(l => l.id !== id); saveToLocal({ savedLists: next }); return next;
                });
                showToast('已从历史节点销毁该记录');
            };

            const handleClearAllLists = () => {
                setDialog({
                    visible: true, title: '格式化警告', message: '警告：您确定要清空历史存档流水吗？\n\n(系统保护已开启：包含欠货记录的清单将被自动保留，仅清空无欠货的普通流水。)',
                    onConfirm: () => {
                        setSavedLists(prev => {
                            const remaining = prev.filter(list => list.items.some(item => item.isOwed));
                            saveToLocal({ savedLists: remaining }); return remaining;
                        });
                        showToast('清理完成，欠款清单已自动保留');
                    }
                });
            };

            const handleHideListInWorkspace = (id) => {
                setSavedLists(prev => {
                    const next = prev.map(l => l.id === id ? { ...l, hiddenFromWorkspace: true } : l);
                    saveToLocal({ savedLists: next }); return next;
                });
                showToast('已从近期面板移除');
            };

            const handleHideAllInWorkspace = () => {
                setSavedLists(prev => {
                    const next = prev.map(l => ({ ...l, hiddenFromWorkspace: true }));
                    saveToLocal({ savedLists: next }); return next;
                });
                showToast('近期面板记录已清空');
            };

            // ---- 欠货追踪逻辑 ----
            const toggleOwedStatus = (listId, itemIndex) => {
                let isNowOwed = false;
                setSavedLists(prev => {
                    const next = prev.map(list => {
                        if (list.id === listId) {
                            const newItems = [...list.items];
                            const currentItem = newItems[itemIndex];
                            const toggledState = !currentItem.isOwed;
                            newItems[itemIndex] = { 
                                ...currentItem, isOwed: toggledState,
                                owedQty: toggledState ? (currentItem.owedQty !== undefined ? currentItem.owedQty : currentItem.qty) : currentItem.owedQty,
                                owedModifyCount: toggledState ? (currentItem.owedModifyCount || 0) : currentItem.owedModifyCount,
                                owedRemark: toggledState ? (currentItem.owedRemark || '') : currentItem.owedRemark
                            };
                            isNowOwed = toggledState;
                            return { ...list, items: newItems };
                        }
                        return list;
                    });
                    saveToLocal({ savedLists: next }); return next;
                });
                if (isNowOwed) showToast('已标记为欠货单品', 'warning'); else showToast('欠货记录已解除');
            };

            const handleUpdateOwedItem = (listId, itemIndex, updates) => {
                setSavedLists(prev => {
                    const next = prev.map(list => {
                        if (list.id === listId) {
                            const newItems = [...list.items];
                            newItems[itemIndex] = { ...newItems[itemIndex], ...updates };
                            return { ...list, items: newItems };
                        }
                        return list;
                    });
                    saveToLocal({ savedLists: next }); return next;
                });
                showToast('欠货单数据已更新');
            };

            const owedItems = useMemo(() => {
                const result = [];
                savedLists.forEach(list => {
                    list.items.forEach((item, idx) => {
                        if (item.isOwed) {
                            result.push({
                                listId: list.id, listName: list.name, listTimestamp: list.timestamp, itemIndex: idx,
                                ...item, currentOwedQty: item.owedQty !== undefined ? item.owedQty : item.qty,
                                modifyCount: item.owedModifyCount || 0, remark: item.owedRemark || ''
                            });
                        }
                    });
                });
                return result;
            }, [savedLists]);

            const owedStats = useMemo(() => {
                let qty = 0; let cost = 0;
                owedItems.forEach(i => { qty += i.currentOwedQty; cost += i.currentOwedQty * i.sku.cost; });
                return { qty, cost };
            }, [owedItems]);

            // ---- V3.0 数据魔方 (Data Cube) 分析引擎 ----
            const analyticsData = useMemo(() => {
                const categoryStats = {};
                let totalCost = 0;
                let totalQty = 0;
                savedLists.forEach(list => {
                    list.items.forEach(item => {
                        const cat = item.sku.category || '未分类';
                        const cost = item.sku.cost * item.qty;
                        if(!categoryStats[cat]) categoryStats[cat] = { label: cat, value: 0, qty: 0 };
                        categoryStats[cat].value += cost;
                        categoryStats[cat].qty += item.qty;
                        totalCost += cost;
                        totalQty += item.qty;
                    });
                });
                const sorted = Object.values(categoryStats).sort((a,b)=>b.value - a.value).map((cat, idx) => ({
                    ...cat, color: CHART_COLORS[idx % CHART_COLORS.length]
                }));
                return { pieData: sorted, totalCost, totalQty };
            }, [savedLists]);

            const handleExportAnalyticsCSV = () => {
                const BOM = '\uFEFF';
                let csvContent = BOM + "数据魔方分析报告\n";
                csvContent += `生成时间,${new Date().toLocaleString()}\n`;
                csvContent += `历史总流转资金,￥${analyticsData.totalCost.toFixed(2)}\n`;
                csvContent += `历史总流转件数,${analyticsData.totalQty}件\n\n`;
                
                csvContent += "分类,资金占比(￥),占比(%),件数\n";
                analyticsData.pieData.forEach(cat => {
                    const percentage = analyticsData.totalCost > 0 ? ((cat.value / analyticsData.totalCost) * 100).toFixed(2) : 0;
                    csvContent += `${cat.label},${cat.value.toFixed(2)},${percentage}%,${cat.qty}\n`;
                });
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `数据魔方分析报告_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                showToast('数据魔方分析报告已成功导出');
            };

            // ---- 下拉交互 ----
            const querySuggestions = useMemo(() => {
                if (!queryTerm.trim()) return [];
                return skus.filter(s => s.name.toLowerCase().includes(queryTerm.toLowerCase())).slice(0, 10);
            }, [queryTerm, skus]);

            useEffect(() => { setHighlightedSuggestionIndex(-1); }, [queryTerm]);
            useEffect(() => {
                if (highlightedSuggestionIndex >= 0) {
                    const el = document.getElementById(`suggestion-${highlightedSuggestionIndex}`);
                    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            }, [highlightedSuggestionIndex]);

            useEffect(() => {
                if (highlightedCatIndex >= 0) {
                    const el = document.getElementById(`cat-suggestion-${highlightedCatIndex}`);
                    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            }, [highlightedCatIndex]);

            const allCategories = useMemo(() => {
                const cats = new Set(['未分类']);
                skus.forEach(s => { if (s.category) cats.add(s.category); });
                return Array.from(cats);
            }, [skus]);

            // 资产矩阵：排序处理器
            const handleSort = (key) => {
                let direction = 'ascending';
                if (sortConfig.key === key && sortConfig.direction === 'ascending') direction = 'descending';
                setSortConfig({ key, direction });
            };

            const getSortIcon = (columnName) => {
                if (sortConfig.key !== columnName) return <i className="ph-bold ph-caret-up-down text-gray-300 dark:text-gray-600 opacity-0 group-hover:opacity-100 transition-opacity"></i>;
                if (sortConfig.direction === 'ascending') return <i className="ph-bold ph-caret-up text-win-accent dark:text-win-accentDark"></i>;
                return <i className="ph-bold ph-caret-down text-win-accent dark:text-win-accentDark"></i>;
            };

            const processedSkus = useMemo(() => {
                let sortableSkus = [...skus];
                
                if (searchTerm) sortableSkus = sortableSkus.filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase()));
                if (categoryFilter !== 'All') sortableSkus = sortableSkus.filter(s => (s.category || '未分类') === categoryFilter);
                
                if (sortConfig.key !== null) {
                    sortableSkus.sort((a, b) => {
                        let aValue = a[sortConfig.key];
                        let bValue = b[sortConfig.key];

                        if (sortConfig.key === 'category') {
                            aValue = aValue || '未分类'; bValue = bValue || '未分类';
                        } else if (sortConfig.key === 'name') {
                            aValue = aValue.toLowerCase(); bValue = bValue.toLowerCase();
                        }

                        if (aValue < bValue) return sortConfig.direction === 'ascending' ? -1 : 1;
                        if (aValue > bValue) return sortConfig.direction === 'ascending' ? 1 : -1;
                        return 0;
                    });
                }
                return sortableSkus;
            }, [skus, searchTerm, categoryFilter, sortConfig]);

            const handleEditCategory = (skuName, newCat) => {
                const val = newCat.trim() || '未分类';
                const updatedSkus = skus.map(s => s.name === skuName ? { ...s, category: val } : s);
                setSkus(updatedSkus); saveToLocal({ skus: updatedSkus }); setEditingCategorySkuName(null);
            };

            // ---- 数据库业务逻辑 ----
            const isQuickAddReady = quickAddName.trim() !== '' && quickAddCost.trim() !== '';

            const handleQuickAddSku = () => {
                if (!isQuickAddReady) return;
                const costNum = parseFloat(quickAddCost.replace(/[^\d.]/g, ''));
                if (isNaN(costNum)) return;
                checkPriceWarning(quickAddName, costNum);
                let isNew = true;
                const newSkus = skus.map(s => {
                    if(s.name === quickAddName) { isNew = false; return recordPriceHistory(s, costNum); }
                    return s;
                });
                if(isNew) newSkus.unshift({ name: quickAddName, cost: costNum, category: "未分类", priceHistory: [] });
                setSkus(newSkus); setQuickAddName(''); setQuickAddCost('');
                saveToLocal({ skus: newSkus });
                showToast(`已注册资产并写入矩阵: ${quickAddName}`);
                document.getElementById('add-sku-name')?.focus();
            };

            const handleEditCost = () => {
                const newCost = parseFloat(editingCostValue.replace(/[^\d.]/g, ''));
                if (isNaN(newCost)) return;
                checkPriceWarning(editingSkuName, newCost);
                const updatedSkus = skus.map(s => s.name === editingSkuName ? recordPriceHistory(s, newCost) : s);
                setSkus(updatedSkus); saveToLocal({ skus: updatedSkus }); setEditingSkuName(null);
            };

            const handleDeleteSku = (name) => {
                const newSkus = skus.filter(s => s.name !== name);
                setSkus(newSkus); saveToLocal({ skus: newSkus });
            };

            const handleClearAllSkus = () => {
                setSkus([]); setCart([]); saveToLocal({ skus: [], cart: [] });
                setShowClearConfirm(false); showToast('数据库矩阵已重置');
            };

            const handleDataProcess = (raw) => {
                if (!raw.trim()) return;
                const str = raw.trim();
                
                try {
                    const cleanStr = str.replace(/\s+/g, '');
                    const decoded = decodeURIComponent(atob(cleanStr));
                    const data = JSON.parse(decoded);
                    if(data.skus && Array.isArray(data.skus)) {
                        setDialog({
                            visible: true, title: '全量恢复确认', message: '检测到全量备份密钥！\n\n导入将覆盖当前全部资产矩阵和历史记录，确认恢复吗？',
                            onConfirm: () => {
                                setSkus(data.skus); setCart(data.cart || []); setSavedLists(data.savedLists || []);
                                saveToLocal(data); showToast('系统全量数据已瞬间复原！'); setImportText('');
                            }
                        });
                        return;
                    }
                } catch(e) { }

                const lines = str.split(/\r?\n/).filter(l => l.trim() !== "");
                const results = lines.map((line) => {
                    let parts = line.includes('\t') ? line.split('\t') : (line.includes(',') ? line.split(',') : line.split(/\s{2,}/));
                    parts = parts.map(p => p.trim()).filter(p => p !== "");
                    if (parts.length < 2) return null;
                    const price = parseFloat(parts[1].replace(/[^\d.]/g, ''));
                    if (isNaN(price)) return null;
                    return { name: parts[0], cost: price, category: parts[2] || "未分类", priceHistory: [] };
                }).filter(x => x);
                if (results.length > 0) {
                    const newSkusMap = new Map(skus.map(s => [s.name, s]));
                    results.forEach(s => newSkusMap.set(s.name, s));
                    const finalSkus = Array.from(newSkusMap.values());
                    setSkus(finalSkus); saveToLocal({ skus: finalSkus });
                    showToast(`同步节点已重构，载入 ${results.length} 项实体`);
                    setImportText('');
                }
            };

            const handleExportBackupKey = () => {
                const data = { skus, cart, savedLists };
                const jsonStr = JSON.stringify(data);
                const encoded = btoa(encodeURIComponent(jsonStr));
                
                const textArea = document.createElement("textarea");
                textArea.value = encoded;
                textArea.style.position = "fixed";
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('🔥 密钥复制成功！已存入您的剪贴板，请妥善保存。');
                } catch (err) {
                    showToast('复制失败，请手动选择复制', 'warning');
                }
                document.body.removeChild(textArea);
            };

            const handleExportCSV = () => {
                const BOM = '\uFEFF';
                let csvContent = BOM + "资产名称,进价成本(￥),分类\n";
                skus.forEach(sku => csvContent += `${sku.name},${sku.cost},${sku.category || '未分类'}\n`);
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `决策舱矩阵导出_${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            if (loading) return null;

            return (
                <div className="flex h-screen w-screen overflow-hidden relative" onContextMenu={(e)=>e.preventDefault()}>
                    <div className="win-bg-bloom"></div>

                    {contextMenu.visible && (
                        <div 
                            className="fixed z-[1000] w-48 bg-white/95 dark:bg-[#2d2d2d]/95 backdrop-blur-xl border border-black/10 dark:border-white/10 shadow-2xl rounded-lg py-1.5 flex flex-col"
                            style={{ top: Math.min(contextMenu.y, window.innerHeight - 100), left: Math.min(contextMenu.x, window.innerWidth - 200) }}
                            onMouseDown={(e)=>e.stopPropagation()}
                        >
                            {contextMenu.view === 'workspace' ? (
                                <>
                                    <button className="px-4 py-2.5 text-left text-[13px] hover:bg-black/5 dark:hover:bg-white/5 transition-colors flex items-center gap-2 text-gray-700 dark:text-gray-200" onClick={() => { handleHideListInWorkspace(contextMenu.listId); setContextMenu({...contextMenu, visible: false}); }}>
                                        <i className="ph-bold ph-eye-slash text-gray-500"></i> 从工作台隐藏记录
                                    </button>
                                    <div className="h-px bg-black/5 dark:bg-white/5 my-1 w-full"></div>
                                    <button className="px-4 py-2.5 text-left text-[13px] hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors flex items-center gap-2 text-red-600 font-bold" onClick={() => { handleHideAllInWorkspace(); setContextMenu({...contextMenu, visible: false}); }}>
                                        <i className="ph-bold ph-broom"></i> 清空工作台所有展示
                                    </button>
                                </>
                            ) : (
                                <>
                                    <button className="px-4 py-2.5 text-left text-[13px] hover:bg-black/5 dark:hover:bg-white/5 transition-colors flex items-center gap-2 text-gray-700 dark:text-gray-200" onClick={() => { handleDeleteList(contextMenu.listId); setContextMenu({...contextMenu, visible: false}); }}>
                                        <i className="ph-bold ph-trash text-red-500"></i> 精确销毁本记录
                                    </button>
                                    <div className="h-px bg-black/5 dark:bg-white/5 my-1 w-full"></div>
                                    <button className="px-4 py-2.5 text-left text-[13px] hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors flex items-center gap-2 text-red-600 font-bold" onClick={() => { handleClearAllLists(); setContextMenu({...contextMenu, visible: false}); }}>
                                        <i className="ph-bold ph-warning-octagon"></i> 格式化全部流水
                                    </button>
                                </>
                            )}
                        </div>
                    )}

                    {remarkTooltip.visible && remarkTooltip.text && (
                        <div className="fixed z-[1000] bg-gray-900/95 dark:bg-white/95 backdrop-blur-sm text-white dark:text-gray-900 px-3 py-2 rounded-md shadow-xl text-[12px] max-w-xs break-words pointer-events-none" style={{ top: remarkTooltip.y + 15, left: remarkTooltip.x + 15 }}>
                            {remarkTooltip.text}
                        </div>
                    )}

                    <aside className="w-[200px] bg-white/40 dark:bg-black/40 backdrop-blur-3xl border-r border-black/5 dark:border-white/5 flex flex-col z-20 shadow-lg shrink-0">
                        <div className="p-5 flex items-center gap-2.5">
                            <div className="w-7 h-7 bg-win-accent dark:bg-win-accentDark rounded-md flex items-center justify-center text-white dark:text-gray-900 shadow-md shrink-0">
                                <i className="ph-bold ph-aperture text-lg"></i>
                            </div>
                            <div className="font-bold text-[14px] tracking-widest text-gray-900 dark:text-white truncate">润晟软件 V3.0</div>
                        </div>

                        <nav className="flex-1 px-3 space-y-1 mt-2">
                            <button onClick={() => setActiveView('workspace')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-[13px] transition-colors ${activeView === 'workspace' ? 'bg-black/5 dark:bg-white/10 font-bold text-gray-900 dark:text-white' : 'text-gray-600 dark:text-gray-400 hover:bg-black/5 dark:hover:bg-white/5'}`}>
                                <i className={`ph-bold ph-shopping-cart text-[16px] ${activeView === 'workspace' ? 'text-win-accent dark:text-win-accentDark' : ''}`}></i>
                                进货工作台
                            </button>
                            <button onClick={() => setActiveView('history')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-[13px] transition-colors ${activeView === 'history' ? 'bg-black/5 dark:bg-white/10 font-bold text-gray-900 dark:text-white' : 'text-gray-600 dark:text-gray-400 hover:bg-black/5 dark:hover:bg-white/5'}`}>
                                <i className={`ph-bold ph-clock-counter-clockwise text-[16px] ${activeView === 'history' ? 'text-win-accent dark:text-win-accentDark' : ''}`}></i>
                                历史清单流水
                            </button>
                            <button onClick={() => setActiveView('owed')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-[13px] transition-colors ${activeView === 'owed' ? 'bg-black/5 dark:bg-white/10 font-bold text-gray-900 dark:text-white' : 'text-gray-600 dark:text-gray-400 hover:bg-black/5 dark:hover:bg-white/5'}`}>
                                <i className={`ph-bold ph-truck text-[16px] ${activeView === 'owed' ? 'text-orange-500' : ''}`}></i>
                                <span className="flex-1 text-left">欠货追踪大盘</span>
                                {owedItems.length > 0 && <span className="text-[10px] bg-orange-500 text-white px-1.5 rounded">{owedItems.length}</span>}
                            </button>
                            <button onClick={() => setActiveView('analytics')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-[13px] transition-colors ${activeView === 'analytics' ? 'bg-black/5 dark:bg-white/10 font-bold text-gray-900 dark:text-white' : 'text-gray-600 dark:text-gray-400 hover:bg-black/5 dark:hover:bg-white/5'}`}>
                                <i className={`ph-bold ph-chart-pie-slice text-[16px] ${activeView === 'analytics' ? 'text-emerald-500' : ''}`}></i>
                                数据魔方分析
                            </button>
                            <div className="my-2 h-px bg-black/5 dark:bg-white/5 mx-2"></div>
                            <button onClick={() => setActiveView('database')} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-[13px] transition-colors ${activeView === 'database' ? 'bg-black/5 dark:bg-white/10 font-bold text-gray-900 dark:text-white' : 'text-gray-600 dark:text-gray-400 hover:bg-black/5 dark:hover:bg-white/5'}`}>
                                <i className={`ph-bold ph-database text-[16px] ${activeView === 'database' ? 'text-win-accent dark:text-win-accentDark' : ''}`}></i>
                                资产数据库
                            </button>
                        </nav>

                        <div className="p-4 border-t border-black/5 dark:border-white/5 space-y-4">
                            <button onClick={toggleTheme} className="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-[13px] text-gray-600 dark:text-gray-400 hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                                <i className={`ph-fill ${isDarkMode ? 'ph-moon text-amber-400' : 'ph-sun text-yellow-500'} text-[16px]`}></i>
                                {isDarkMode ? '切换明亮模式' : '切换暗黑模式'}
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col relative z-10 overflow-hidden bg-transparent">
                        {statusMsg.text && (
                            <div className="absolute top-6 left-1/2 -translate-x-1/2 z-[9999] animate-in slide-in-from-top-4 fade-in">
                                <div className={`border shadow-lg px-4 py-2 rounded-md text-sm font-medium flex items-center gap-2 ${statusMsg.type === 'warning' ? 'bg-orange-50 dark:bg-[#3d2a10] border-orange-200 dark:border-orange-900/50 text-orange-600 dark:text-orange-400' : 'bg-white dark:bg-[#333] border-black/10 dark:border-white/10 text-gray-800 dark:text-gray-100'}`}>
                                    <i className={`ph-fill ${statusMsg.type === 'warning' ? 'ph-warning-circle' : 'ph-check-circle'} ${statusMsg.type === 'warning' ? 'text-orange-500' : 'text-green-500'}`}></i> {statusMsg.text}
                                </div>
                            </div>
                        )}

                        <div className="flex-1 w-full max-w-[1600px] mx-auto overflow-hidden p-8 flex flex-col">
                            
                            {/* =========================================
                                视图 1：进货工作台 
                                ========================================= */}
                            {activeView === 'workspace' && (
                                <div className="flex gap-6 w-full h-full animate-in fade-in min-h-0">
                                    <div className="flex-[2] flex flex-col gap-6 h-full min-h-0">
                                        <div className="flex justify-between items-end shrink-0 h-[50px] pb-1">
                                            <div>
                                                <h1 className="text-2xl font-bold leading-none">进货工作台</h1>
                                                <p className="text-[10px] text-gray-500 dark:text-gray-400 mt-1.5 uppercase tracking-widest">Purchase Workspace</p>
                                            </div>
                                        </div>

                                        <div className={`${winCard} p-4 flex flex-col gap-3 relative z-30 overflow-visible shrink-0 quick-add-controls`}>
                                            <div className="flex items-center justify-between">
                                                <div className="text-xs font-bold flex items-center gap-1.5 transition-colors">
                                                    <div className={`w-2 h-2 rounded-full ${selectedCartIndex >= 0 ? 'bg-win-accent dark:bg-win-accentDark animate-pulse' : (queryTerm ? 'bg-amber-500' : 'bg-green-500')}`}></div>
                                                    {selectedCartIndex >= 0 && cart[selectedCartIndex] 
                                                        ? <span className="text-win-accent dark:text-win-accentDark">选中对象: {cart[selectedCartIndex].sku.name}</span>
                                                        : <span className="text-gray-500">检索与快捷加购</span>
                                                    }
                                                </div>
                                                <div className="flex gap-2">
                                                    {[50, 100, 500, 1000].map(num => (
                                                        <button key={num} onClick={() => {
                                                            let target = null;
                                                            if (selectedCartIndex >= 0 && cart[selectedCartIndex]) target = cart[selectedCartIndex].sku;
                                                            else if (querySuggestions.length > 0) target = querySuggestions[highlightedSuggestionIndex >= 0 ? highlightedSuggestionIndex : 0];
                                                            else if (skus.length > 0) target = skus[0];
                                                            if (target) handleQuickAddPurchase(target, num);
                                                        }} className="px-3 py-1 text-[11px] font-bold bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 rounded transition-colors active:scale-95">
                                                            +{num}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="relative group w-full">
                                                <input 
                                                    type="text" 
                                                    placeholder="输入名称进行快速检索引擎... (上下箭头选择，回车加购100件)" 
                                                    className={`${winInput} pl-10 h-[40px] pr-24 text-[13px]`} 
                                                    value={queryTerm} 
                                                    onChange={e => {setQueryTerm(e.target.value); setShowQueryDropdown(true);}} 
                                                    onFocus={e => {setShowQueryDropdown(true); e.target.select();}} 
                                                    onBlur={() => setTimeout(() => setShowQueryDropdown(false), 200)}
                                                    onKeyDown={e => { 
                                                        if (e.key === 'ArrowDown') { e.preventDefault(); setHighlightedSuggestionIndex(prev => Math.min(prev + 1, querySuggestions.length - 1)); } 
                                                        else if (e.key === 'ArrowUp') { e.preventDefault(); setHighlightedSuggestionIndex(prev => Math.max(prev - 1, 0)); } 
                                                        else if (e.key === 'Enter') {
                                                            e.preventDefault();
                                                            if (querySuggestions.length > 0) { 
                                                                const targetIdx = highlightedSuggestionIndex >= 0 ? highlightedSuggestionIndex : 0;
                                                                handleQuickAddPurchase(querySuggestions[targetIdx], 100); 
                                                                setQueryTerm(''); setShowQueryDropdown(false); setHighlightedSuggestionIndex(-1); e.target.blur(); 
                                                            } 
                                                        } 
                                                    }} 
                                                />
                                                <i className="ph-bold ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                                                
                                                {showQueryDropdown && queryTerm && (
                                                    <div className="absolute top-full mt-2 left-0 right-0 bg-white/95 dark:bg-[#2d2d2d]/95 backdrop-blur-xl border border-black/10 dark:border-white/10 shadow-xl rounded-lg max-h-64 overflow-y-auto z-50 p-1 custom-scrollbar">
                                                        {querySuggestions.length > 0 ? querySuggestions.map((s, idx) => (
                                                            <div key={s.name} id={`suggestion-${idx}`} className={`px-3 py-2.5 rounded-md flex justify-between items-center cursor-pointer transition-colors ${idx === highlightedSuggestionIndex ? 'bg-win-accent/20 dark:bg-win-accentDark/20 font-bold border-l-2 border-win-accent dark:border-win-accentDark' : 'hover:bg-black/5 dark:hover:bg-white/5 border-l-2 border-transparent'}`} 
                                                                onClick={() => { handleQuickAddPurchase(s, 100); setQueryTerm(''); setShowQueryDropdown(false); setHighlightedSuggestionIndex(-1); }}>
                                                                <span className="text-[13px]">{s.name} <span className="text-[10px] text-gray-400 ml-1.5 px-1.5 py-0.5 bg-black/5 dark:bg-white/10 rounded">{s.category || '未分类'}</span></span>
                                                                <span className="text-[12px] font-bold text-win-accent dark:text-win-accentDark">￥{s.cost.toFixed(2)}</span>
                                                            </div>
                                                        )) : <div className="p-4 text-center text-xs text-gray-500">矩阵中无此实体记录</div>}
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        <div className={`${winCard} flex-1 overflow-hidden flex flex-col min-h-0`}>
                                            <div className="px-5 py-3.5 border-b border-black/5 dark:border-white/5 flex justify-between items-center bg-black/[0.02] dark:bg-white/[0.02] shrink-0">
                                                <span className="text-[13px] font-bold text-gray-800 dark:text-gray-200">装载清单明细 ({cart.length})</span>
                                                <div className="flex gap-2">
                                                    {cart.length > 0 && (
                                                        <>
                                                            <button onClick={handleSaveList} className="text-[11px] text-win-accent dark:text-win-accentDark hover:bg-blue-50 dark:hover:bg-blue-900/30 px-2 py-1 rounded transition-colors flex items-center">
                                                                <i className="ph-bold ph-floppy-disk mr-1"></i>归档流水
                                                            </button>
                                                            <button onClick={clearCart} className="text-[11px] text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 px-2 py-1 rounded transition-colors flex items-center">
                                                                <i className="ph-bold ph-trash mr-1"></i>重置
                                                            </button>
                                                        </>
                                                    )}
                                                </div>
                                            </div>
                                            <div className="flex-1 overflow-y-auto custom-scrollbar p-2">
                                                {cart.length === 0 ? (
                                                    <div className="h-full flex flex-col items-center justify-center opacity-30">
                                                        <i className="ph-bold ph-shopping-cart-simple text-5xl mb-3"></i>
                                                        <span className="text-[13px] font-bold">清单处于真空状态</span>
