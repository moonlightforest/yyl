                                                                />
                                                            </td>
                                                            <td className="px-6 py-3.5 text-center">
                                                                <button onClick={() => toggleOwedStatus(item.listId, item.itemIndex)} className="text-[11px] font-bold bg-green-500 text-white px-3 py-1.5 rounded hover:bg-green-600 transition-colors shadow-sm active:scale-95 whitespace-nowrap">
                                                                    <i className="ph-bold ph-check mr-1"></i> 解除欠款
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            {owedItems.length === 0 && (
                                                <div className="flex flex-col items-center justify-center h-full opacity-40">
                                                    <i className="ph-bold ph-check-circle text-6xl mb-4 text-green-500"></i>
                                                    <div className="text-[15px] font-bold tracking-widest">目前运作正常，无任何欠货记录</div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* =========================================
                                视图 4：数据魔方分析 
                                ========================================= */}
                            {activeView === 'analytics' && (
                                <div className="flex gap-6 w-full h-full animate-in fade-in min-h-0">
                                    <div className="flex-[2] flex flex-col gap-6 h-full min-h-0">
                                        <div className="flex justify-between items-end shrink-0 h-[50px] pb-1">
                                            <div>
                                                <h1 className="text-2xl font-bold leading-none">数据魔方分析</h1>
                                                <p className="text-[10px] text-gray-500 dark:text-gray-400 mt-1.5 uppercase tracking-wider">Business Analytics</p>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <button onClick={handleExportAnalyticsCSV} className={`${winButtonSec} !text-emerald-600 dark:!text-emerald-400 hover:!bg-emerald-50 dark:hover:!bg-emerald-900/20 !py-1.5`}>
                                                    <i className="ph-bold ph-download-simple"></i> 下载魔方数据
                                                </button>
                                            </div>
                                        </div>

                                        <div className={`${winCard} flex-1 flex flex-col items-center justify-center p-8 overflow-hidden relative`}>
                                            <div className="text-[13px] font-bold text-gray-500 absolute top-6 left-6">资产分布概览图 (基于历史流水)</div>
                                            <div className="w-[300px] h-[300px] relative drop-shadow-2xl">
                                                <SvgPieChart data={analyticsData.pieData} />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex-1 flex flex-col gap-6 h-full min-h-0">
                                        <div className="h-[50px] shrink-0"></div>

                                        <div className={`${winCard} p-6 flex flex-col items-center justify-center text-center bg-gradient-to-br from-emerald-50 to-white dark:from-[#0d3b2b] dark:to-[#222] shadow-md border-t-4 border-t-emerald-500 shrink-0 w-full overflow-hidden`}>
                                            <div className="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-2 shrink-0">历史总交易资产沉淀</div>
                                            <div className={`font-black text-emerald-600 dark:text-emerald-400 tracking-tighter mb-4 w-full truncate transition-all duration-300 ${getDynamicTextSize(analyticsData.totalCost)}`}>
                                                ￥<AnimatedNumber value={analyticsData.totalCost} />
                                            </div>
                                            <div className="inline-block bg-emerald-500/10 px-4 py-1.5 rounded-full text-[11px] font-bold text-emerald-600 dark:text-emerald-400 shrink-0 truncate max-w-full">
                                                共流转资产 {analyticsData.totalQty} 件
                                            </div>
                                        </div>

                                        <div className={`${winCard} flex-1 overflow-hidden flex flex-col min-h-0 w-full`}>
                                            <div className="px-5 py-3.5 border-b border-black/5 dark:border-white/5 text-[12px] font-bold text-gray-500 flex items-center justify-between shrink-0 w-full">
                                                <div className="flex items-center gap-2"><i className="ph-fill ph-tag shrink-0"></i> <span>分类资金大头占比</span></div>
                                            </div>
                                            <div className="flex-1 overflow-y-auto p-5 space-y-4 custom-scrollbar w-full">
                                                {analyticsData.pieData.length === 0 ? <div className="text-center text-[12px] opacity-40 py-4 font-medium">无数据</div> : 
                                                analyticsData.pieData.map((cat, idx) => {
                                                    const percentage = (cat.value / analyticsData.totalCost) * 100;
                                                    return (
                                                        <div key={idx} className="space-y-1.5 w-full">
                                                            <div className="flex justify-between text-[12px] font-bold gap-2 w-full">
                                                                <span className="flex items-center gap-2 truncate flex-1 text-gray-800 dark:text-gray-200">
                                                                    <span className="w-2 h-2 rounded-full shrink-0" style={{backgroundColor: cat.color}}></span>
                                                                    <span className="truncate">{cat.label}</span>
                                                                </span>
                                                                <span className="shrink-0 max-w-[45%] text-right font-black" style={{color: cat.color}}>￥{cat.value.toFixed(2)} ({percentage.toFixed(1)}%)</span>
                                                            </div>
                                                            <div className="w-full h-1.5 bg-black/5 dark:bg-white/10 rounded-full overflow-hidden">
                                                                <div className="h-full rounded-full transition-all duration-1000" style={{width: `${percentage}%`, backgroundColor: cat.color}}></div>
                                                            </div>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* =========================================
                                视图 5：资产数据库 
                                ========================================= */}
                            {activeView === 'database' && (
                                <div className="flex gap-6 w-full h-full animate-in fade-in min-h-0">
                                    
                                    <div className="flex-[3] flex flex-col gap-6 h-full min-h-0">
                                        <div className="flex justify-between items-end shrink-0 h-[50px] pb-1">
                                            <div>
                                                <h1 className="text-2xl font-bold leading-none">资产矩阵</h1>
                                                <p className="text-[10px] text-gray-500 dark:text-gray-400 mt-1.5 uppercase tracking-wider">Asset Database</p>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <span className="text-[11px] font-bold px-2 py-1 bg-black/5 dark:bg-white/10 rounded text-gray-600 dark:text-gray-300">{skus.length} 实体驻留</span>
                                                <button onClick={() => setShowClearConfirm(true)} className={`${winButtonSec} !text-red-500 hover:!bg-red-50 dark:hover:!bg-red-900/20 !py-1.5`}>
                                                    <i className="ph-bold ph-trash"></i> 格式化矩阵
                                                </button>
                                            </div>
                                        </div>

                                        <div className={`${winCard} flex-1 flex flex-col overflow-hidden min-h-0`}>
                                            <div className="p-3 border-b border-black/5 dark:border-white/5 bg-black/[0.02] dark:bg-white/[0.02] shrink-0 flex gap-2">
                                                <div className="relative flex-1">
                                                    <i className="ph-bold ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                                                    <input 
                                                        type="text" 
                                                        className={`${winInput} pl-9 border-transparent shadow-none bg-transparent hover:bg-black/5 dark:hover:bg-white/5 focus:bg-white dark:focus:bg-[#1f1f1f] text-[13px] h-[36px]`} 
                                                        placeholder="全局搜寻实体名称..." 
                                                        value={searchTerm} 
                                                        onChange={e => setSearchTerm(e.target.value)} 
                                                    />
                                                </div>
                                                <div className="relative shrink-0 w-48">
                                                    <i className="ph-bold ph-funnel absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                                                    <select
                                                        className={`${winInput} pl-9 pr-8 border-transparent shadow-none bg-transparent hover:bg-black/5 dark:hover:bg-white/5 focus:bg-white dark:focus:bg-[#1f1f1f] text-[13px] h-[36px] cursor-pointer appearance-none outline-none`}
                                                        value={categoryFilter}
                                                        onChange={e => setCategoryFilter(e.target.value)}
                                                    >
                                                        <option value="All">全部分类</option>
                                                        {allCategories.map(cat => (
                                                            <option key={cat} value={cat}>{cat}</option>
                                                        ))}
                                                    </select>
                                                    <i className="ph-bold ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px]"></i>
                                                </div>
                                            </div>
                                            
                                            <div className="flex-1 overflow-y-auto custom-scrollbar relative">
                                                <table className="w-full text-left border-collapse">
                                                    <thead className="sticky top-0 bg-white/95 dark:bg-[#2d2d2d]/95 backdrop-blur z-10 text-[11px] text-gray-500 uppercase border-b border-black/5 dark:border-white/5 shadow-sm select-none">
                                                        <tr>
                                                            <th className="font-bold px-6 py-3 w-[40%] whitespace-nowrap cursor-pointer hover:bg-black/5 dark:hover:bg-white/5 transition-colors group" onClick={() => handleSort('name')}>
                                                                <div className="flex items-center gap-1">实体名称 {getSortIcon('name')}</div>
                                                            </th>
                                                            <th className="font-bold px-6 py-3 w-[20%] text-center whitespace-nowrap cursor-pointer hover:bg-black/5 dark:hover:bg-white/5 transition-colors group" onClick={() => handleSort('category')}>
                                                                <div className="flex items-center justify-center gap-1">分类 {getSortIcon('category')}</div>
                                                            </th>
                                                            <th className="font-bold px-6 py-3 w-[25%] text-right whitespace-nowrap cursor-pointer hover:bg-black/5 dark:hover:bg-white/5 transition-colors group" onClick={() => handleSort('cost')}>
                                                                <div className="flex items-center justify-end gap-1">基准进价 / 历史波动 {getSortIcon('cost')}</div>
                                                            </th>
                                                            <th className="font-bold px-6 py-3 w-[15%] text-center whitespace-nowrap">操作</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="text-[13px] text-gray-800 dark:text-gray-200">
                                                        {processedSkus.map((sku, idx) => (
                                                            <tr key={idx} className="border-b border-black/5 dark:border-white/5 hover:bg-black/5 dark:hover:bg-white/5 transition-colors group">
                                                                <td className="px-6 py-3.5 font-bold truncate max-w-[200px]">{sku.name}</td>
                                                                <td className="px-6 py-3.5 text-center whitespace-nowrap relative">
                                                                    {editingCategorySkuName === sku.name ? (
                                                                        <div className="relative inline-block text-left w-28">
                                                                            <button autoFocus onFocus={() => setHighlightedCatIndex(allCategories.indexOf(sku.category || '未分类'))} onBlur={() => setTimeout(() => setEditingCategorySkuName(null), 150)} 
                                                                                onKeyDown={e => { 
                                                                                    if (e.key === 'ArrowDown') { e.preventDefault(); setHighlightedCatIndex(prev => Math.min(prev + 1, allCategories.length - 1)); } 
                                                                                    else if (e.key === 'ArrowUp') { e.preventDefault(); setHighlightedCatIndex(prev => Math.max(prev - 1, 0)); } 
                                                                                    else if (e.key === 'Enter') { e.preventDefault(); if (highlightedCatIndex >= 0) handleEditCategory(sku.name, allCategories[highlightedCatIndex]); } 
                                                                                    else if (e.key === 'Escape') setEditingCategorySkuName(null);
                                                                                }}
                                                                                className={`${winInput} w-full text-center py-1 h-[26px] text-[12px] cursor-pointer outline-none overflow-hidden flex items-center justify-center`} >
                                                                                {allCategories[highlightedCatIndex >= 0 ? highlightedCatIndex : 0] || '未分类'}
                                                                            </button>
                                                                            <div className="absolute top-full mt-1 left-1/2 -translate-x-1/2 w-32 bg-white/95 dark:bg-[#2d2d2d]/95 backdrop-blur-xl border border-black/10 dark:border-white/10 shadow-xl rounded-md max-h-40 overflow-y-auto z-[100] p-1 custom-scrollbar">
                                                                                {allCategories.map((cat, cIdx) => (
                                                                                    <div key={cat} id={`cat-suggestion-${cIdx}`} className={`px-3 py-1.5 rounded-sm text-[12px] cursor-pointer transition-colors text-center ${cIdx === highlightedCatIndex ? 'bg-win-accent/20 dark:bg-win-accentDark/20 font-bold text-win-accent dark:text-win-accentDark' : 'hover:bg-black/5 dark:hover:bg-white/5 text-gray-800 dark:text-gray-200'}`}
                                                                                        onMouseDown={(e) => { e.preventDefault(); handleEditCategory(sku.name, cat); }} onMouseEnter={() => setHighlightedCatIndex(cIdx)}>
                                                                                        {cat}
                                                                                    </div>
                                                                                ))}
                                                                            </div>
                                                                        </div>
                                                                    ) : (
                                                                        <span className="text-[11px] font-bold text-gray-500 dark:text-gray-400 bg-black/5 dark:bg-white/10 px-2.5 py-1 rounded-md cursor-pointer hover:bg-black/10 dark:hover:bg-white/20 transition-colors inline-block" onClick={() => { setEditingCategorySkuName(sku.name); }}>
                                                                            {sku.category || '未分类'}
                                                                        </span>
                                                                    )}
                                                                </td>
                                                                <td className="px-6 py-3.5 text-right whitespace-nowrap">
                                                                    <div className="flex items-center justify-end gap-2">
                                                                        {sku.priceHistory && sku.priceHistory.length > 0 && (
                                                                            <div className="relative group/hist inline-block">
                                                                                <i className="ph-bold ph-trend-up text-win-accent dark:text-win-accentDark cursor-help opacity-60 hover:opacity-100 transition-opacity p-1"></i>
                                                                                <div className="absolute right-0 top-full mt-1 w-48 bg-white/95 dark:bg-[#2d2d2d]/95 backdrop-blur-xl border border-black/10 dark:border-white/10 shadow-xl rounded-lg z-[100] p-2 hidden group-hover/hist:block text-left animate-in fade-in zoom-in-95">
                                                                                    <div className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 px-1 border-b border-black/5 dark:border-white/5 pb-1">历史进价波动雷达</div>
                                                                                    <div className="max-h-32 overflow-y-auto custom-scrollbar">
                                                                                        {sku.priceHistory.slice().reverse().map((h, i) => (
                                                                                            <div key={i} className="flex justify-between items-center text-[11px] py-1 px-1">
                                                                                                <span className="text-gray-500">{h.date}</span>
                                                                                                <span className="font-bold text-gray-800 dark:text-gray-200">￥{h.cost.toFixed(2)}</span>
                                                                                            </div>
                                                                                        ))}
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        )}
                                                                        {editingSkuName === sku.name ? (
                                                                            <input autoFocus onFocus={e => e.target.select()} className={`${winInput} w-24 text-right py-1 h-[26px] text-[13px]`} value={editingCostValue} onChange={e => setEditingCostValue(e.target.value)} onBlur={handleEditCost} onKeyDown={e => { if(e.key==='Enter') handleEditCost(); }} />
                                                                        ) : (
                                                                            <span className="font-black text-win-accent dark:text-win-accentDark cursor-pointer px-2 py-1 rounded hover:bg-black/5 dark:hover:bg-white/10" onClick={() => {setEditingSkuName(sku.name); setEditingCostValue(sku.cost.toString());}}>
                                                                                ￥{sku.cost.toFixed(2)}
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                </td>
                                                                <td className="px-6 py-3.5 text-center whitespace-nowrap">
                                                                    <button className="text-gray-400 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100" onClick={() => handleDeleteSku(sku.name)}>
                                                                        <i className="ph-bold ph-trash text-lg"></i>
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                                {skus.length === 0 && <div className="text-center py-10 text-[13px] text-gray-400 font-medium">矩阵查无此实体</div>}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex-1 flex flex-col gap-6 h-full min-h-0">
                                        <div className="h-[50px] shrink-0"></div>

                                        <div className={`${winCard} p-5 space-y-4 shrink-0`}>
                                            <div className="text-[13px] font-bold border-b border-black/5 dark:border-white/5 pb-2 mb-3">
                                                注册新实体入库
                                            </div>
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="text-[11px] text-gray-500 mb-1 block font-medium">实体资产名称</label>
                                                    <input className={`${winInput} text-[13px] py-1.5`} placeholder="如：极光本..." value={quickAddName} onChange={e => setQuickAddName(e.target.value)} onFocus={e => e.target.select()} id="add-sku-name" />
                                                </div>
                                                <div>
                                                    <label className="text-[11px] text-gray-500 mb-1 block font-medium">进价核算 (￥)</label>
                                                    <input className={`${winInput} text-[13px] py-1.5`} placeholder="0.00" value={quickAddCost} onChange={e => setQuickAddCost(e.target.value)} onFocus={e => e.target.select()} onKeyDown={e=>{if(e.key==='Enter') handleQuickAddSku();}} />
                                                </div>
                                                <button className={`w-full mt-2 ${winButton} !py-2 ${!isQuickAddReady ? 'opacity-50 cursor-not-allowed' : ''}`} onClick={handleQuickAddSku} disabled={!isQuickAddReady}>
                                                    <i className="ph-bold ph-plus"></i> 写入矩阵
                                                </button>
                                            </div>
                                        </div>

                                        {/* 终端同步 & V3.0 密钥流转控制台 */}
                                        <div className={`${winCard} flex-1 overflow-hidden flex flex-col min-h-0`}>
                                            <div className="p-4 border-b border-black/5 dark:border-white/5 shrink-0 flex justify-between items-center">
                                                <span className="text-[13px] font-bold">终端互联与防灾备份</span>
                                                <button onClick={handleExportBackupKey} className="text-[11px] font-bold text-win-accent dark:text-win-accentDark hover:bg-black/5 dark:hover:bg-white/10 px-2 py-1 rounded transition-colors flex items-center gap-1">
                                                    <i className="ph-bold ph-key"></i>生成密钥
                                                </button>
                                            </div>
                                            
                                            <div className="p-4 flex-1 flex flex-col gap-3">
                                                <div className="grid grid-cols-2 gap-2 shrink-0">
                                                    <button className={`${winButtonSec} !px-2 !py-1 !text-[11px] flex-col gap-1 h-[50px]`} onClick={handleExportCSV}>
                                                        <i className="ph-bold ph-download-simple text-[16px] text-indigo-500"></i>导出 CSV
                                                    </button>
                                                    <button className={`${winButtonSec} !px-2 !py-1 !text-[11px] flex-col gap-1 h-[50px]`} onClick={() => fileInputRef.current.click()}>
                                                        <i className="ph-bold ph-upload-simple text-[16px] text-emerald-500"></i>导入 CSV
                                                        <input type="file" ref={fileInputRef} className="hidden" accept=".csv,.txt" onChange={e => { const r = new FileReader(); r.onload = ev => handleDataProcess(ev.target.result); r.readAsText(e.target.files[0]); }} />
                                                    </button>
                                                </div>
                                                <div className="flex-1 flex flex-col relative min-h-[100px] gap-2">
                                                    <textarea 
                                                        className={`${winInput} flex-1 text-[11px] font-mono resize-none bg-black/[0.02] dark:bg-white/[0.02] shadow-inner custom-scrollbar p-3`} 
                                                        placeholder="在此粘贴系统备份密钥以恢复数据...&#10;&#10;也可在此直接粘贴 CSV 文本进行录入。" 
                                                        value={importText} 
                                                        onChange={e => setImportText(e.target.value)} 
                                                    />
                                                    <button 
                                                        className={`w-full ${winButton} !py-2 ${!importText.trim() ? 'opacity-50 cursor-not-allowed' : ''}`}
                                                        onClick={() => handleDataProcess(importText)}
                                                        disabled={!importText.trim()}
                                                    >
                                                        <i className="ph-bold ph-check-circle"></i> 确认导入配置
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {showClearConfirm && (
                        <div className="absolute inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm animate-in fade-in">
                            <div className={`${winCard} p-6 w-[400px] shadow-2xl flex flex-col gap-4 scale-100 animate-in zoom-in-95`}>
                                <div className="flex gap-4">
                                    <div className="w-10 h-10 rounded-full bg-red-100 dark:bg-red-900/30 flex items-center justify-center text-red-500 shrink-0"><i className="ph-bold ph-warning text-xl"></i></div>
                                    <div>
                                        <h3 className="font-bold text-lg mb-1">格式化警告</h3>
                                        <p className="text-sm text-gray-500 dark:text-gray-400 leading-relaxed">即将清除所有实体的存档。<br/>该操作属于底层销毁，无法撤销。</p>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3 mt-2 border-t border-black/5 dark:border-white/5 pt-4">
                                    <button className={winButtonSec} onClick={() => setShowClearConfirm(false)}>取消</button>
                                    <button className={`${winButton} !bg-red-500 hover:!opacity-80`} onClick={handleClearAllSkus}>执行销毁</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 全局系统交互弹窗 (替代浏览器原生 alert/confirm) */}
                    {dialog.visible && (
                        <div className="absolute inset-0 z-[10000] flex items-center justify-center bg-black/40 backdrop-blur-sm animate-in fade-in">
                            <div className={`${winCard} p-6 w-[400px] shadow-2xl flex flex-col gap-4 scale-100 animate-in zoom-in-95`}>
                                <div className="flex gap-4">
                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center shrink-0 ${dialog.isAlert ? 'bg-orange-100 dark:bg-orange-900/30 text-orange-500' : 'bg-blue-100 dark:bg-blue-900/30 text-win-accent dark:text-win-accentDark'}`}>
                                        <i className={`ph-bold ${dialog.isAlert ? 'ph-info' : 'ph-question'} text-xl`}></i>
                                    </div>
                                    <div className="flex-1">
                                        <h3 className="font-bold text-lg mb-1">{dialog.title}</h3>
                                        <p className="text-sm text-gray-600 dark:text-gray-300 leading-relaxed whitespace-pre-wrap">{dialog.message}</p>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3 mt-2 border-t border-black/5 dark:border-white/5 pt-4">
                                    {!dialog.isAlert && <button className={winButtonSec} onClick={() => setDialog({ ...dialog, visible: false })}>取消</button>}
                                    <button className={`${winButton} ${dialog.isAlert ? '!bg-orange-500' : ''}`} onClick={() => { if(dialog.onConfirm) dialog.onConfirm(); setDialog({ ...dialog, visible: false }); }}>
                                        {dialog.isAlert ? '我知道了' : '确认执行'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
