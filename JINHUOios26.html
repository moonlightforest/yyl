<style>
:root{

  --safe-bottom:env(safe-area-inset-bottom);
  --gutter:24px;
  --dock-h:104px;
  --dock-gap:14px;
  --bg:#f7f5ef;
  --bg-mid:#f1f5f8;
  --bg-low:#fff9f0;
  --ink:#182236;
  --ink-2:#435069;
  --muted:#8e99ad;

  --surface:rgba(255,255,255,.66);

  --surface-3:rgba(255,255,255,.22);
  --stroke:rgba(255,255,255,.82);
  --stroke-soft:rgba(122,139,165,.12);
  --brand:#5c5af6;
  --brand-2:#766eff;
  --cyan:#7fe6ff;
  --green:#22c784;
  --red:#ff637a;

  --hero:linear-gradient(140deg,#08163c 0%,#0b1d50 50%,#08142d 100%);
  --nav-bg:rgba(255,255,255,.74);
  --tab-off:#9ba6ba;
  --tab-on:#5c5af6;
  --radius-xl:34px;
  --radius-2xl:42px;
  --theme-speed:2800ms;
}
body.dark{
  --bg:#101214;
  --bg-mid:#15191e;
  --bg-low:#1b1e23;
  --ink:#f0f2f5;
  --ink-2:#c5ccd6;
  --muted:#929ba8;
  --faint:#6f7886;
  --surface:rgba(35,39,45,.66);
  --surface-2:rgba(18,21,25,.46);
  --surface-3:rgba(255,255,255,.035);
  --stroke:rgba(255,255,255,.075);
  --stroke-soft:rgba(255,255,255,.055);
  --brand:#e9edf6;
  --brand-2:#c9d0dd;
  --cyan:#b8c1d2;
  --green:#58d99c;
  --red:#ff8191;
  --shadow:0 22px 50px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.025);
  --shadow-strong:0 24px 62px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.04);
  --hero:linear-gradient(140deg,#252a31 0%,#181d23 54%,#101317 100%);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* 左滑删除修正：不再露出红色底板，只显示独立垃圾箱图标，产品卡片本身不变色 */
.swipe-asset.open .swipe-content{transform:translateX(-72px)!important;}
.swipe-delete{
  width:72px!important;
  background:transparent!important;
  box-shadow:none!important;
  border-radius:0!important;
  color:transparent!important;
  font-size:0!important;
  place-items:center!important;
}
.swipe-delete::before{
  content:'🗑';
  width:48px;
  height:48px;
  border-radius:18px;
  display:grid;
  place-items:center;
  font-size:23px;
  color:var(--red);
  background:rgba(255,99,122,.10);
  border:1px solid rgba(255,99,122,.16);
  box-shadow:0 10px 22px rgba(255,99,122,.08), inset 0 1px 0 rgba(255,255,255,.18);
}
body.dark .swipe-delete::before{
  background:rgba(255,129,145,.08);
  border-color:rgba(255,129,145,.14);
  box-shadow:0 10px 22px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.04);
}

/* 输入/检索可操作性修复：避免装饰层或固定层抢焦点 */
input,textarea{user-select:text!important;-webkit-user-select:text!important;pointer-events:auto!important;position:relative;z-index:60;}
button{pointer-events:auto!important;}
.search-wrap{z-index:70!important;}
.search,.sheet-input,.asset-search-input{touch-action:manipulation;pointer-events:auto!important;}
.console-wrap,.asset-sheet{z-index:60!important;}
.results{z-index:90!important;pointer-events:auto!important;}
.nav{z-index:30!important;}
.asset-search{position:relative;z-index:20;}
.asset-search-input{width:100%;height:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font-size:20px;font-weight:820;padding:0;}
.asset-search-input::placeholder{color:#a1adc0;}
body.dark .asset-search-input{color:var(--ink);}
</style>
</head>
<body>
<div class="backdrop"><div class="aura"></div><div class="grain"></div></div><div class="theme-wash" id="themeWash"></div>
<main class="app">
<header class="header"><div class="brand"><div class="badge"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><path d="M12 4v16M4 12h16"></path><path d="M6.3 6.3c3 2.2 8.4 2.2 11.4 0"></path><path d="M6.3 17.7c3-2.2 8.4-2.2 11.4 0"></path></svg></div><h1>决策舱 PRO</h1></div><button class="mode press" id="modeBtn" aria-label="切换明暗模式"><span id="modeSymbol">☀︎</span></button></header>
<section class="main">
<div class="view" id="view-dashboard" style="display:none"><h2 class="page-title">参数雷达</h2><div class="eyebrow">Dashboard</div><div class="gap"></div><div class="hero"><div class="hero-label">预测资金流出</div><div class="hero-money" id="dashTotal">¥0.00</div><div class="hero-side" id="dashQty">0 件单品</div></div><div class="gap"></div><div class="metrics"><div class="material metric"><span>平均单件成本</span><b id="dashAvg">¥0.00</b></div><div class="material metric"><span>最贵单品进价</span><b id="dashMax">¥0.00</b></div></div><div class="gap"></div><div class="material metric" style="min-height:160px"><span>资金流向占比</span><div id="rankList" style="margin-top:16px"></div></div></div>
<div class="view" id="view-purchase"><h2 class="page-title">进货单</h2><div class="eyebrow">Purchase List</div><div class="gap"></div><div class="hero purchase-total"><div style="display:flex;align-items:flex-end;justify-content:space-between;gap:18px"><div><div class="hero-label">应付采购总额</div><div class="hero-money" id="totalMoney">¥0.00</div></div><div class="hero-side" id="totalQty">0 件单品</div></div></div><div class="gap"></div><div class="stack" id="purchaseList"></div><div style="height:178px"></div></div>
<div class="console-wrap"><div class="material console"><div class="console-top"><div class="focus"><i></i><span id="focusText">抹茶拨动笔</span></div><button class="quick press" id="quickAddBtn">+ 100</button></div><div class="search-grid"><div class="search-wrap"><span class="search-ico"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></span><input class="search" id="searchInput" placeholder="大拇指滑向此处搜索资产..."></div><div class="preview" id="previewPrice">¥0.00</div></div></div></div><div class="material results" id="searchResults" style="display:none"></div>
<div class="view" id="view-assets" style="display:none"><h2 class="page-title">资产矩阵</h2><div class="asset-sub" id="assetCountText">0 实体驻留</div><button class="clear-assets press" id="clearAssetsBtn">一键清空资产</button><div class="asset-search"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.1" style="stroke:#aab4c4;flex-shrink:0"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input id="assetSearchInput" class="asset-search-input" placeholder="在全息矩阵中全局检索..." autocomplete="off"></div><div class="gap"></div><div class="stack" id="assetList"></div><div style="height:236px"></div></div><div class="material asset-sheet" id="assetSheet"><div class="sheet-title">资产注册终端</div><input class="sheet-input" id="newAssetName" placeholder="资产名称"><div class="sheet-grid"><input class="sheet-input" id="newAssetCost" placeholder="进价"><input class="sheet-input" id="newAssetCat" placeholder="分类"></div><button class="sheet-submit press" id="addAssetBtn">注册实体入库</button></div>
<div class="view" id="view-sync" style="display:none"><div class="sync-center"><div class="orb"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10"></path><path d="M8.5 9.5 12 13l3.5-3.5"></path><path d="M5 15v4h14v-4"></path></svg></div><div class="sync-title">终端互联</div><div class="sync-sub">Cross-Terminal Sync</div><div class="sync-grid"><button class="material sync-box press" id="exportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v10"></path><path d="M8.5 9.5 12 13l3.5-3.5"></path><path d="M5 15v4h14v-4"></path></svg><span>导出快照</span></button><label class="material sync-box press"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color:#22c784"><path d="M12 21V11"></path><path d="M8.5 14.5 12 11l3.5 3.5"></path><path d="M5 15v4h14v-4"></path></svg><span>导入实体</span><input type="file" id="fileInput" accept=".csv,.txt,text/csv,text/plain" style="display:none"></label></div><div class="signature"><div class="cn">姚银亮独家设计</div><div class="en">Exclusively Designed by Yao Yinliang</div></div></div></div>
</section>
<nav class="nav material"><button class="tab press" data-tab="dashboard"><svg viewBox="0 0 24 24"><path d="M6 5v14"></path><path d="M12 3v18"></path><path d="M18 7v10"></path><circle cx="6" cy="10" r="2"></circle><circle cx="12" cy="15" r="2"></circle><circle cx="18" cy="11" r="2"></circle></svg><span>参数雷达</span></button><button class="tab press active" data-tab="purchase"><svg viewBox="0 0 24 24"><path d="M3 5h2l2 10h10l2-7H7"></path><circle cx="10" cy="19" r="1.5"></circle><circle cx="17" cy="19" r="1.5"></circle></svg><span>查询进货</span></button><button class="tab press" data-tab="assets"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="6.5" ry="2.8"></ellipse><path d="M5.5 6v4c0 1.5 2.9 2.8 6.5 2.8s6.5-1.3 6.5-2.8V6"></path><path d="M5.5 10.2v4c0 1.5 2.9 2.8 6.5 2.8s6.5-1.3 6.5-2.8v-4"></path></svg><span>资产矩阵</span></button><button class="tab press" data-tab="sync"><svg viewBox="0 0 24 24"><path d="M8 7H4m0 0 2.5-2.5M4 7l2.5 2.5"></path><path d="M16 17h4m0 0-2.5-2.5M20 17l-2.5 2.5"></path><path d="M4 7h10a4 4 0 0 1 4 4v0"></path><path d="M20 17H10a4 4 0 0 1-4-4v0"></path></svg><span>终端互联</span></button></nav>
</main><div class="confirm-mask" id="clearConfirm"><div class="material confirm-box"><div class="confirm-title">确认清空资产？</div><div class="confirm-text">此操作会删除资产矩阵中的所有产品数据。默认选择“否”，避免误触。</div><div class="confirm-actions"><button class="confirm-btn confirm-no press" id="clearNo" autofocus>否</button><button class="confirm-btn confirm-yes press" id="clearYes">是，清空</button></div></div></div><div class="toast" id="toast"></div>
<script>
const LF=String.fromCharCode(10),TAB=String.fromCharCode(9),CR=String.fromCharCode(13),BOM=String.fromCharCode(65279),STORE='decision_cabin_refined_v1';
const base={dark:false,currentTab:'purchase',focusName:'抹茶拨动笔',cart:[{name:'励志A5大本子',cost:.65,qty:300},{name:'小豆丁铅笔',cost:.18,qty:300}],assets:[{name:'8色蜡笔圣诞款',cost:.58,cat:'未分类'},{name:'ins风文字挂件',cost:.93,cat:'钥匙扣小挂件'},{name:'PP笔筒',cost:.88,cat:'笔袋笔筒'},{name:'爱国胸针',cost:.16,cat:'胸针徽章'},{name:'抹茶拨动笔',cost:2.75,cat:'创意笔'},{name:'流沙中性笔',cost:.60,cat:'中性笔'}]};
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(STORE));return s?Object.assign({},base,s):Object.assign({},base)}catch(e){return Object.assign({},base)}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function $(id){return document.getElementById(id)}
function money(n){return '¥'+Number(n||0).toFixed(2)}
function clean(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),2000)}
function totals(){let total=0,qty=0,max=null;state.cart.forEach(x=>{total+=x.cost*x.qty;qty+=x.qty;if(!max||x.cost>max.cost)max=x});return{total,qty,avg:qty?total/qty:0,max}}
function setMode(){document.body.classList.toggle('dark',!!state.dark);$('modeSymbol').textContent=state.dark?'☾':'☀︎';const wash=$('themeWash');wash.style.background=state.dark?'linear-gradient(180deg,rgba(33,37,43,.62),rgba(11,13,16,.24))':'linear-gradient(180deg,rgba(255,248,236,.82),rgba(199,238,255,.20))'}
function setTabs(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===state.currentTab));['dashboard','purchase','assets','sync'].forEach(t=>{$('view-'+t).style.display=state.currentTab===t?'block':'none'});$('assetSheet').style.display=state.currentTab==='assets'?'block':'none';document.querySelector('.console-wrap').style.display=state.currentTab==='purchase'?'block':'none'}
function renderDashboard(){const t=totals();$('dashTotal').textContent=money(t.total);$('dashQty').textContent=t.qty+' 件单品';$('dashAvg').textContent=money(t.avg);$('dashMax').textContent=t.max?money(t.max.cost):'¥0.00';const top=state.cart.slice().sort((a,b)=>b.cost*b.qty-a.cost*a.qty).slice(0,6);$('rankList').innerHTML=top.length?top.map(x=>{const sum=x.cost*x.qty;const p=t.total?Math.min(100,sum/t.total*100):0;return `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:850"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${clean(x.name)}</span><span>${money(sum)}</span></div><div class="progress" style="margin-top:7px"><div class="bar" style="width:${p}%"></div></div></div>`}).join(''):'<div class="asset-sub">暂无采购数据</div>'}
function renderPurchase(){const t=totals();$('purchaseList').innerHTML=state.cart.map((item,i)=>`<div class="material purchase-row"><div><div class="item-name">${clean(item.name)}</div><div class="item-meta">¥${item.cost.toFixed(2)} × ${item.qty} = <b>${money(item.cost*item.qty)}</b></div></div><div class="qtybox">${item.qty}</div><button class="remove press" data-r="${i}">－</button></div>`).join('');$('totalMoney').textContent=money(t.total);$('totalQty').textContent=t.qty+' 件单品';const f=state.assets.find(x=>x.name===state.focusName)||state.assets[0];$('focusText').textContent=f?f.name:'未选择资产';$('previewPrice').textContent=f?money(f.cost):'¥0.00';document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{state.cart.splice(Number(b.dataset.r),1);save();render();toast('已移除商品')})}
function renderAssets(){const input=$('assetSearchInput');const q=input?input.value.trim().toLowerCase():'';const rows=state.assets.map((x,i)=>({x,i})).filter(o=>!q||o.x.name.toLowerCase().includes(q)||String(o.x.cat||'').toLowerCase().includes(q));$('assetCountText').textContent=state.assets.length+' 实体驻留'+(q?' · 匹配 '+rows.length:'');$('assetList').innerHTML=rows.length?rows.map(o=>`<div class="swipe-asset" data-swipe="${o.i}"><button class="swipe-delete press" data-da="${o.i}" aria-label="删除资产">🗑</button><div class="material asset-row swipe-content"><div><div class="asset-name">${clean(o.x.name)}</div><div class="asset-tag" style="display:inline-block;margin-top:8px">${clean(o.x.cat||'未分类')}</div></div><div class="asset-actions"><div class="asset-price">${money(o.x.cost)}</div></div></div></div>`).join(''):'<div class="material metric" style="min-height:120px"><span>'+(state.assets.length?'没有匹配资产':'资产矩阵为空')+'</span><b style="font-size:18px;color:var(--muted)">'+(state.assets.length?'请换个关键词检索':'请从下方录入或导入实体')+'</b></div>';document.querySelectorAll('[data-da]').forEach(b=>b.onclick=()=>{state.assets.splice(Number(b.dataset.da),1);save();render();toast('已删除资产')});bindAssetSwipe()}
function renderSearch(){const input=$('searchInput'),box=$('searchResults');if(!input||!box)return;const q=input.value.trim().toLowerCase();if(!q){box.style.display='none';box.innerHTML='';return}const res=state.assets.filter(x=>x.name.toLowerCase().includes(q)||String(x.cat||'').toLowerCase().includes(q)).slice(0,80);box.style.display='block';box.innerHTML=res.length?res.map((x,i)=>`<button class="result press" data-p="${i}">${clean(x.name)}<small>${money(x.cost)} · ${clean(x.cat||'未分类')}</small></button>`).join(''):'<div class="result"><small>没有匹配资产</small></div>';box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const a=res[Number(b.dataset.p)];state.focusName=a.name;if(!state.cart.some(x=>x.name===a.name))state.cart.unshift({name:a.name,cost:a.cost,qty:0});input.value='';box.style.display='none';save();render();toast('已加入焦点')})}
function exportCSV(){const rows=['商品名称,成本,分类'];state.assets.forEach(x=>rows.push([x.name,x.cost,x.cat||''].join(',')));const csv=BOM+rows.join(LF),blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='决策舱资产快照.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出快照')}
function importText(text){text=String(text||'').split(CR).join('');const out=[];text.split(LF).forEach((line,i)=>{line=line.trim();if(!line)return;if(i===0&&(line.includes('商品')||line.includes('名称')||line.includes('成本')))return;const parts=line.includes(TAB)?line.split(TAB):line.split(',');const cost=parseFloat(String(parts[1]||'').replaceAll('¥','').replaceAll('￥','').replaceAll(' ',''));if(parts[0]&&isFinite(cost))out.push({name:parts[0].trim(),cost,cat:(parts[2]||'未分类').trim()})});if(!out.length){toast('未识别到有效数据');return}state.assets=out;save();render();toast('已导入 '+out.length+' 条实体')}
function bindAssetSwipe(){document.querySelectorAll('.swipe-asset').forEach(row=>{let sx=0,dx=0;row.ontouchstart=e=>{sx=e.touches[0].clientX;dx=0};row.ontouchmove=e=>{dx=e.touches[0].clientX-sx};row.ontouchend=()=>{document.querySelectorAll('.swipe-asset').forEach(x=>{if(x!==row)x.classList.remove('open')});if(dx<-34)row.classList.add('open');else if(dx>20)row.classList.remove('open')}})}
function openClearConfirm(){$('clearConfirm').classList.add('show');setTimeout(()=>$('clearNo').focus(),30)}
function closeClearConfirm(){$('clearConfirm').classList.remove('show')}
function bind(){ $('modeBtn').onclick=()=>{document.body.classList.add('switching');const wash=$('themeWash');wash.classList.remove('run');void wash.offsetWidth;wash.classList.add('run');setTimeout(()=>{state.dark=!state.dark;setMode();save()},180);setTimeout(()=>document.body.classList.remove('switching'),2600)};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{state.currentTab=t.dataset.tab;const box=$('searchResults');if(box)box.style.display='none';save();setTabs()});$('addAssetBtn').onclick=()=>{const name=$('newAssetName').value.trim(),cost=parseFloat($('newAssetCost').value.trim()),cat=$('newAssetCat').value.trim()||'未分类';if(!name||!isFinite(cost)){toast('请填写资产名称与进价');return}state.assets.unshift({name,cost,cat});$('newAssetName').value='';$('newAssetCost').value='';$('newAssetCat').value='';save();render();toast('已注册实体入库')};$('clearAssetsBtn').onclick=openClearConfirm;$('clearNo').onclick=closeClearConfirm;$('clearYes').onclick=()=>{state.assets=[];state.focusName='';save();render();closeClearConfirm();toast('资产已清空')};$('clearConfirm').onclick=e=>{if(e.target.id==='clearConfirm')closeClearConfirm()};$('exportBtn').onclick=exportCSV;$('fileInput').onchange=e=>{const file=e.target.files&&e.target.files[0];if(!file)return;file.text().then(importText);e.target.value=''};$('searchInput').oninput=renderSearch;$('assetSearchInput').oninput=renderAssets;$('quickAddBtn').onclick=()=>{const f=state.assets.find(x=>x.name===state.focusName)||state.assets[0];if(!f){toast('暂无资产');return}const item=state.cart.find(x=>x.name===f.name);if(item)item.qty+=100;else state.cart.unshift({name:f.name,cost:f.cost,qty:100});save();render();toast('已加购 +100')}}
function render(){setMode();setTabs();renderDashboard();renderPurchase();renderAssets()}
bind();render();
</script>
</body>
</html>
